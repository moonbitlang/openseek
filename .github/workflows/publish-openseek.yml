name: publish-openseek

# Bump the root module version, then dispatch this workflow.
# Publish any new dependency versions (such as protocol or editor) first.
on:
  workflow_dispatch:

concurrency:
  group: publish-openseek
  cancel-in-progress: false

jobs:
  publish-openseek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install moon
        run: |
          version="$(cat "$GITHUB_WORKSPACE/desktop/.moonbit-version")"
          test -n "$version"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBITLANG_TOKEN secret is not set."
            exit 1
          fi
          trap 'rm -f ~/.moon/credentials.json' EXIT
          umask 077
          printf '%s\n' "$SECRET" > ~/.moon/credentials.json
          moon version --all
          node scripts/publish.mjs root
