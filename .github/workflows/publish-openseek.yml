name: publish-openseek

# Publishes the modules this repository owns under the `moonbitlang` namespace:
# `moonbitlang/openseek_protocol` (`protocol/`), `moonbitlang/openseek_tools`
# (`tools_sdk/`) and `moonbitlang/openseek` (repo root) to mooncakes.
# Manual. Bump `version` in the `moon.mod` of every module you want to release,
# then select those modules below. All three are published under the moonbitlang
# namespace, so they use the organization's mooncakes token, not a personal one.
#
# Select only the modules whose version changed: mooncakes rejects a version
# that is already published, and re-publishing an unchanged module would fail
# the job before it reached the modules after it.
#
# `openseek_protocol` is published first because the root `openseek` module
# depends on it; `openseek_tools` is independent and published in between. A
# root release that needs a new protocol version must select both. The
# publish itself type-checks the module, and the full workspace build/tests are
# already gated on every main push by ci.yml. The root `.moonignore` keeps the
# nested member modules (desktop, editor, …) out of the published archive.

on:
  workflow_dispatch:
    inputs:
      publish_protocol:
        description: Publish moonbitlang/openseek_protocol (bump protocol/moon.mod first).
        type: boolean
        default: false
      publish_tools_sdk:
        description: Publish moonbitlang/openseek_tools (bump tools_sdk/moon.mod first).
        type: boolean
        default: false
      publish_root:
        description: Publish moonbitlang/openseek (bump moon.mod first).
        type: boolean
        default: true

jobs:
  publish-openseek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # MOONCAKES_MOONBITLANG_TOKEN is the moonbitlang org's mooncakes token:
      # only it can publish under the moonbitlang/* owner namespace.
      - name: publish moonbitlang/openseek_protocol
        if: inputs.publish_protocol
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        working-directory: protocol
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBITLANG_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          trap 'rm -f ~/.moon/credentials.json' EXIT
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm -f ~/.moon/credentials.json

      - name: publish moonbitlang/openseek_tools
        if: inputs.publish_tools_sdk
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        working-directory: tools_sdk
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBITLANG_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          trap 'rm -f ~/.moon/credentials.json' EXIT
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm -f ~/.moon/credentials.json

      - name: publish moonbitlang/openseek
        if: inputs.publish_root
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBITLANG_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          trap 'rm -f ~/.moon/credentials.json' EXIT
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm -f ~/.moon/credentials.json
