name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      # The browser packager reads Editor MoonBit packages, styles, fonts, and
      # Mermaid assets directly from this checkout.
      - "editor/**"
      # Desktop's browser frontend renders the shared engine event protocol
      # and root-module tool output views.
      - "protocol/**"
      - "agent_tool/edit_diff/**"
      - "agent_tool/mbtx/html/**"
      - "jsonrpc/**"
      - "viz_export/**"
      - "moon.mod"
      - "moon.work"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "editor/**"
      - "protocol/**"
      - "agent_tool/edit_diff/**"
      - "agent_tool/mbtx/html/**"
      - "jsonrpc/**"
      - "viz_export/**"
      - "moon.mod"
      - "moon.work"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"

# A newer PR head supersedes its older run. Keep main runs complete so every
# relevant merged commit still receives Desktop E2E and packaging results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-package-windows:
    name: desktop package (Windows app)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Test release script
        run: node --test desktop/scripts/release.test.mjs

      - name: Set up MoonBit
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH

      - name: Update MoonBit dependencies
        run: moon update

      - name: Cache Proton runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/app/moon.mod') }}

      - name: Cache MoonBit toolchain seed
        uses: actions/cache@v4
        with:
          path: desktop/target/moonbit/cache
          key: moonbit-seed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/.moonbit-version') }}

      - name: Assemble Proton CEF runtime
        working-directory: desktop
        run: |
          $manifest = Get-Content app/moon.mod -Raw
          if ($manifest -notmatch '"moonbit-community/proton@([^"]+)"') {
            throw 'desktop/app/moon.mod does not pin Proton'
          }
          moonx "moonbit-community/proton_cli@$($Matches[1])" cef setup

      - name: Build Windows app
        env:
          CL: /bigobj
        run: moon run ./desktop/package/windows --target native -- --release --target app

      - name: Test Windows background job paths and retained reads
        env:
          CL: /bigobj
        # The backend is in the root workspace, which links nothing of Proton,
        # so its test executable needs no runtime DLLs beside it.
        run: moon test desktop/backend/engine/jobs_wbtest.mbt --target native

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-windows-x64
          path: desktop/dist/seekmoon/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  desktop-e2e:
    name: desktop e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/e2e/package-lock.json

      - name: Update MoonBit dependencies
        working-directory: desktop
        run: moon update

      - name: Install E2E dependencies
        working-directory: desktop/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: desktop/e2e
        run: npx playwright install --with-deps chromium

      - name: Build Desktop browser application
        working-directory: desktop
        # The Moon entrypoint remains a compatibility CLI; CI calls the same
        # build program directly. The browser application is built by the root
        # workspace, which holds nothing of Proton.
        run: node package/build.mjs browser

      - name: Run Desktop E2E tests
        working-directory: desktop/e2e
        run: npm test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-report
          path: |
            desktop/e2e/playwright-report
            desktop/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
