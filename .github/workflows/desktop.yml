name: Desktop

# Root CI owns workspace-wide formatting, generated-interface checks, and the
# native/JS check and test matrix. This workflow keeps Proton's macOS release
# test and the platform bundle builds.
on:
  push:
    branches: [main]
  # No paths filter: the desktop package builds and bundles the root
  # `cmd/openseek` engine, so a root-side change to the engine or its event
  # protocol can break the desktop app. Run on every PR (as these jobs did when
  # they lived in ci.yml) rather than enumerate a brittle dependency path list.
  pull_request:

# A newer PR head supersedes its older builds. Keep main runs complete so every
# merged commit still produces its platform validation and artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-appimage:
    name: desktop appimage (linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check out the Proton submodule
        run: git submodule update --init desktop/lepus

      # Root CI's stable/native main job owns the Linux cache. This packaging
      # job restores it without creating a workflow- or PR-private duplicate.
      - name: Restore CEF distribution
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.proton/cache/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/lepus/cli/cef/cef_platform.mbt') }}

      - name: Set up MoonBit (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version
        run: |
          moon version --all

      - name: Seed MoonBit registry index
        run: |
          mkdir -p "$HOME/.moon/registry"
          for attempt in 1 2 3; do
            rm -rf "$HOME/.moon/registry/index"
            if git \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=60 \
              clone --depth 1 https://mooncakes.io/git/index "$HOME/.moon/registry/index"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      # libx11-dev: the packager rebuilds libproton from the Proton sources,
      # whose CMake build pkg-config-checks gtk+-3.0 and x11.
      - name: Install GTK and WebKitGTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev

      - name: Build the AppImage
        run: moon -C desktop run --target native package/linux -- --release

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-linux-x86_64
          path: desktop/dist/SeekMoon-linux-x86_64.AppImage
          if-no-files-found: error

  desktop-macos:
    name: desktop app (macos, unsigned)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check out the Proton submodule
        run: git submodule update --init desktop/lepus

      # Pull requests restore the default-branch cache without writing a
      # merge-ref cache that no other PR can use.
      - name: Restore CEF distribution
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.proton/cache/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/lepus/cli/cef/cef_platform.mbt') }}

      - name: Set up MoonBit (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version
        run: |
          moon version --all

      - name: Seed MoonBit registry index
        run: |
          mkdir -p "$HOME/.moon/registry"
          for attempt in 1 2 3; do
            rm -rf "$HOME/.moon/registry/index"
            if git \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=60 \
              clone --depth 1 https://mooncakes.io/git/index "$HOME/.moon/registry/index"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      # Exercise Proton's runtime/window path on macOS before packaging. Scope
      # the command to Proton instead of repeating root CI's workspace-wide
      # native tests.
      - name: Test Proton runtime (release)
        run: moon test --target native --release -p justjavac/proton/native

      # No --sign or --notarize argument, so the app is only ad-hoc signed,
      # the DMG container is unsigned, and neither artifact is intended for
      # end-user distribution.
      - name: Build the macOS artifacts
        run: moon -C desktop run --target native package/macos -- --release --target dmg --target zip

      # Only a trusted push to main publishes the cache shared by later PRs.
      - name: Save CEF distribution
        if: >-
          github.event_name == 'push' &&
          steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.proton/cache/cef
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-macos-arm64
          path: |
            desktop/dist/SeekMoon.app.zip
            desktop/dist/SeekMoon.dmg
          if-no-files-found: error

  desktop-windows:
    name: desktop app (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check out the Proton submodule
        run: git submodule update --init desktop/lepus

      # Pull requests restore the default-branch cache without writing a
      # merge-ref cache that no other PR can use.
      - name: Restore CEF distribution
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.proton/cache/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/lepus/cli/cef/cef_platform.mbt') }}

      - name: Set up MoonBit (nightly)
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: nightly
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          # Retry up to 3 times: the Chocolatey community feed occasionally
          # returns 503, causing a silent zero-exit install that leaves
          # makensis.exe absent. Verify the binary exists before moving on.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
              exit 0
            }
            Write-Warning "NSIS not installed after attempt $attempt."
            if ($attempt -lt 3) { Start-Sleep -Seconds ($attempt * 15) }
          }
          exit 1

      - name: Show MoonBit version
        shell: pwsh
        run: |
          moon version --all

      - name: Seed MoonBit registry index
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME\.moon\registry" | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Remove-Item -Recurse -Force "$HOME\.moon\registry\index" -ErrorAction SilentlyContinue
            git `
              -c http.lowSpeedLimit=1000 `
              -c http.lowSpeedTime=60 `
              clone --depth 1 https://mooncakes.io/git/index "$HOME\.moon\registry\index"
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds ($attempt * 10)
          }
          exit 1

      # Root CI runs native tests on Linux. Exercise the terminal package on
      # Windows too so platform-specific PTY tests cannot hide behind a
      # successful production build.
      - name: Test Windows terminal
        shell: pwsh
        timeout-minutes: 5
        run: moon -C desktop test internal/terminal --target native

      # Pull requests upload only the portable ZIP, so they do not spend time
      # installing NSIS or recompressing the same bundle as an installer.
      - name: Build the Windows ZIP
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: moon -C desktop run --target native package/windows -- --release --target zip

      - name: Build the Windows app bundle and installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: moon -C desktop run --target native package/windows -- --release

      # Only a trusted push to main publishes the cache shared by later PRs.
      - name: Save CEF distribution
        if: >-
          github.event_name == 'push' &&
          steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.proton/cache/cef
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-windows-x64
          path: desktop/dist/SeekMoon-windows-x64.zip
          if-no-files-found: error
