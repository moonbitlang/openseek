name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      # The browser packager reads Editor MoonBit packages, styles, fonts, and
      # Mermaid assets directly from this checkout.
      - "editor/**"
      # Desktop's browser frontend renders the shared engine event protocol
      # and root-module tool output views.
      - "protocol/**"
      - "agent_tool/edit_diff/**"
      - "agent_tool/mbtx/html/**"
      - "jsonrpc/**"
      - "viz_export/**"
      - "moon.mod"
      - "moon.work"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "editor/**"
      - "protocol/**"
      - "agent_tool/edit_diff/**"
      - "agent_tool/mbtx/html/**"
      - "jsonrpc/**"
      - "viz_export/**"
      - "moon.mod"
      - "moon.work"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"

# A newer PR head supersedes its older run. Keep main runs complete so every
# relevant merged commit still receives Desktop E2E and packaging results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-package-windows:
    name: desktop package (Windows app)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Test release and packaging scripts
        run: node --test desktop/scripts/release.test.mjs desktop/package/signing.test.mjs desktop/package/notarization.test.mjs

      - name: Set up MoonBit
        run: |
          $env:MOONBIT_INSTALL_VERSION = (Get-Content "$env:GITHUB_WORKSPACE/desktop/.moonbit-version" -Raw -ErrorAction Stop).Trim()
          if (-not $env:MOONBIT_INSTALL_VERSION) { throw "desktop/.moonbit-version is empty" }
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH

      - name: Update MoonBit dependencies
        run: moon update

      - name: Cache Proton runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/app/moon.mod') }}

      - name: Cache MoonBit toolchain seed
        uses: actions/cache@v4
        with:
          path: desktop/target/moonbit/cache
          key: moonbit-seed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/.moonbit-version') }}

      - name: Assemble Proton CEF runtime
        working-directory: desktop
        run: |
          $manifest = Get-Content app/moon.mod -Raw
          if ($manifest -notmatch '"moonbit-community/proton@([^"]+)"') {
            throw 'desktop/app/moon.mod does not pin Proton'
          }
          moonx "moonbit-community/proton_cli@$($Matches[1])" cef setup

      - name: Build Windows app
        env:
          CL: /bigobj
        run: moon run ./desktop/package/windows --target native -- --release --target app

      - name: Test Windows background job paths and retained reads
        env:
          CL: /bigobj
        run: |
          # The test executable lives outside the packaged app, so Windows
          # cannot find its linked Proton/CEF DLLs beside the executable.
          $runtimeDirs = Get-ChildItem desktop/dist/seekmoon -Recurse -Filter *.dll |
            Select-Object -ExpandProperty DirectoryName -Unique
          if (-not $runtimeDirs) { throw 'Packaged app contains no runtime DLLs' }
          $env:PATH = ($runtimeDirs -join ';') + ';' + $env:PATH
          moon test desktop/backend/engine/jobs_wbtest.mbt --target native

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-windows-x64
          path: desktop/dist/seekmoon/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The window host is the only module that depends on Proton, so it builds in
  # its own desktop/app/moon.work and is checked here rather than by the root
  # workspace gates in ci.yml. Its other members are covered there.
  desktop-app:
    name: desktop app (Linux, native)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          version="$(cat "$GITHUB_WORKSPACE/desktop/.moonbit-version")"
          test -n "$version"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        working-directory: desktop/app
        run: moon update

      # Proton comes from the registry, so the version it is pinned to lives in
      # desktop/app/moon.mod and nowhere else. Read it back here rather than
      # repeating it, and reuse it for both the CEF cache key and the CLI.
      - name: Resolve pinned Proton version
        id: proton
        run: |
          version="$(sed -n 's/.*"moonbit-community\/proton@\([^"]*\)".*/\1/p' desktop/app/moon.mod)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pull requests may restore the default branch's cache, but their own
      # merge-ref caches are private to that PR and cannot warm other branches.
      - name: Restore Proton runtime
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.proton.outputs.version }}

      # Proton's Linux prebuild queries GTK and X11 while producing its native
      # link configuration. The shared libraries are on the runner image, but
      # their pkg-config metadata and headers come from the development packages.
      - name: Install Proton Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libx11-dev

      # `cef setup` installs the release-selected runtime and subprocess helper
      # into Proton's user-level immutable store. Setup is idempotent after a
      # cache hit.
      - name: Assemble Proton CEF runtime
        run: >-
          moonx "moonbit-community/proton_cli@${{ steps.proton.outputs.version }}"
          cef setup

      # Main is the sole Linux writer; PR jobs remain restore-only.
      - name: Save Proton runtime
        if: github.event_name == 'push' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      # Moon path arguments select single packages, so list the host's own;
      # keep this list in step with `app_packages` in desktop/justfile.
      - name: Check, format, and test the window host
        working-directory: desktop/app
        run: |
          packages=". internal/cdp internal/extension"
          moon check $packages --target native --deny-warn
          moon fmt --check $packages
          moon info $packages
          untracked_mbti="$(git ls-files --others --exclude-standard -- '*.mbti')"
          if [ -n "$untracked_mbti" ] ||
            ! git diff --quiet --ignore-blank-lines -- '*.mbti'; then
            git status --short -- '*.mbti'
            git diff --ignore-blank-lines -- '*.mbti'
            exit 1
          fi
          moon test $packages --target native

  desktop-e2e:
    name: desktop e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          version="$(cat "$GITHUB_WORKSPACE/desktop/.moonbit-version")"
          test -n "$version"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/e2e/package-lock.json

      - name: Update MoonBit dependencies
        working-directory: desktop
        run: moon update

      - name: Install E2E dependencies
        working-directory: desktop/e2e
        run: npm ci

      - name: Install Chromium and WebKit
        working-directory: desktop/e2e
        run: npx playwright install --with-deps chromium webkit

      - name: Build Desktop browser application
        working-directory: desktop
        # The Moon entrypoint remains a compatibility CLI. The browser build
        # never touches the window host, so CI calls the build program directly.
        # Each isolated test page loads this bundle, so use the smaller
        # production build instead of repeatedly transferring debug output.
        run: node package/build.mjs browser --release

      - name: Run Desktop E2E tests
        working-directory: desktop/e2e
        run: npm test

      # A test that fails once and passes its retry leaves the job green, and
      # the failed attempt's screenshot and page snapshot are the only record
      # of why. Keep the report for every finished run, not just failed ones.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-report
          path: |
            desktop/e2e/playwright-report
            desktop/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
