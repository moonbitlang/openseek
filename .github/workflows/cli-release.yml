name: CLI release

on:
  pull_request:
    paths:
      - '.github/workflows/cli-release.yml'
      - 'scripts/cli-release/**'
      - 'installation/**'
      - 'resources/**'
      - 'internal/openseek/**'
      - 'desktop/.moonbit-version'
      - 'desktop/package/resources.mjs'
      - 'share/**'
      - 'moon.mod'
      - 'moon.pkg'
      - 'main.mbt'
  workflow_dispatch:

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: native CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned build toolchain
        run: |
          version="$(cat desktop/.moonbit-version)"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve release identity
        id: release
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod)"
          test -n "$version"
          echo "id=cli-v$version" >> "$GITHUB_OUTPUT"
      - name: Test installer and release contracts
        run: |
          moon update
          moon test installation --target native
          node --test scripts/cli-release/release.test.mjs
      - name: Stage matching runtime resources
        run: |
          node scripts/cli-release/prepare.mjs \
            --id '${{ steps.release.outputs.id }}' --platform '${{ matrix.platform }}' \
            --output dist/cli --cache "$RUNNER_TEMP/cli-vendors"
      - name: Build the standalone native CLI
        run: |
          moon build . --target native --release
          cp _build/native/release/build/moonbitlang/openseek/openseek.exe 'dist/cli/openseek-${{ matrix.platform }}'
          chmod +x 'dist/cli/openseek-${{ matrix.platform }}'
      - name: Validate clean-home HTTPS setup and a real tool-using Agent
        run: >-
          python3 scripts/cli-release/smoke.py
          'dist/cli/openseek-${{ matrix.platform }}' dist/cli '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist/cli/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: publish complete CLI release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - name: Verify both architectures and write the download catalog
        id: release
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod)"
          test -n "$version"
          id="cli-v$version"
          node scripts/cli-release/catalog.mjs dist/cli "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Upload all assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          if gh release view "$RELEASE_ID" >/dev/null 2>&1; then
            echo "Release $RELEASE_ID already exists. Bump moon.mod for a new release, or inspect and remove an incomplete draft before retrying."
            exit 1
          fi
          existing_tag="$(git ls-remote --tags --refs origin "refs/tags/$RELEASE_ID")"
          if test -n "$existing_tag"; then
            echo "Tag $RELEASE_ID already exists; use a new CLI version."
            exit 1
          fi
          gh release create "$RELEASE_ID" --target "$GITHUB_SHA" --draft --latest=false \
            --title "OpenSeek CLI ${RELEASE_ID#cli-v}" \
            --notes "Standalone Linux CLI. Download openseek-linux-x64 or openseek-linux-arm64, verify SHA256SUMS, make it executable, and run openseek setup. Git and Codex are installed separately."
          gh release upload "$RELEASE_ID" dist/cli/*
          gh release edit "$RELEASE_ID" --draft=false --latest=false
