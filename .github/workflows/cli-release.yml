name: CLI release

# Bump the root moon.mod version, then dispatch on main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: native CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install the pinned Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = (Get-Content desktop/.moonbit-version -Raw).Trim()
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH
      - name: Install the pinned Unix toolchain
        if: runner.os != 'Windows'
        run: |
          version="$(cat desktop/.moonbit-version)"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build and package the native CLI
        run: |
          # The CLI needs these workspace modules, without Desktop's Proton prebuild.
          printf 'members = [".", "./protocol", "./tools_sdk", "./editor"]\n' > moon.work
          moon update
          moon test installation --target native
          moon build . --target native --release
          moon run scripts/package-cli.mbtx '${{ matrix.platform }}' dist/cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist/cli/*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - name: Publish the CLI archives
        working-directory: dist/cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' ../../moon.mod)"
          test -n "$version"
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "cli-v$version" openseek-*.tar.gz SHA256SUMS \
            --target "$GITHUB_SHA" --title "OpenSeek CLI $version" \
            --notes "Native OpenSeek CLI binaries, rg, and resources. Extract your platform archive and run bin/openseek setup." \
            --latest=false
