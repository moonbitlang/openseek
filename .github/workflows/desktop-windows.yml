name: Desktop Windows

# Windows minutes cost twice Linux minutes, and this package build is the
# slowest Desktop job. Its Windows-specific risk is the native window host,
# backend, and packager; the browser frontend compiles to JS identically on
# every OS and is covered by the Linux desktop e2e job in desktop.yml. Pull
# requests that change only frontend files therefore skip it. Pushes to main use
# desktop.yml's full path list so every relevant merged commit is packaged.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "editor/**"
      - "protocol/**"
      - "share/artifact/**"
      - "agent_tool/edit_diff/**"
      - "agent_tool/mbtx/html/**"
      - "jsonrpc/**"
      - "viz_export/**"
      - "moon.mod"
      - "moon.work"
      - ".github/workflows/desktop-windows.yml"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "editor/**"
      - "protocol/**"
      - "share/artifact/**"
      - "agent_tool/edit_diff/**"
      - "agent_tool/mbtx/html/**"
      - "jsonrpc/**"
      - "viz_export/**"
      - "moon.mod"
      - "moon.work"
      - ".github/workflows/desktop-windows.yml"
      - ".github/workflows/desktop-release.yml"
      # Browser-only sources and documentation. Negations must follow the
      # patterns they narrow.
      - "!desktop/frontend/**"
      - "!desktop/e2e/**"
      - "!desktop/styles/**"
      - "!desktop/pwa/**"
      - "!desktop/*.css"
      - "!desktop/*.md"
      - "!desktop/index.html"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-package-windows:
    name: desktop package (Windows app)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Test release and packaging scripts
        run: node --test desktop/scripts/release.test.mjs desktop/package/notarization.test.mjs

      - name: Set up MoonBit
        run: |
          $env:MOONBIT_INSTALL_VERSION = (Get-Content desktop/.moonbit-version -Raw).Trim()
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH

      - name: Update MoonBit dependencies
        run: moon update

      - name: Cache Proton runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/app/moon.mod') }}

      - name: Cache MoonBit toolchain seed
        uses: actions/cache@v4
        with:
          path: desktop/target/moonbit/cache
          key: moonbit-seed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/.moonbit-version') }}

      - name: Assemble Proton CEF runtime
        working-directory: desktop
        run: |
          $manifest = Get-Content app/moon.mod -Raw
          if ($manifest -notmatch '"moonbit-community/proton@([^"]+)"') {
            throw 'desktop/app/moon.mod does not pin Proton'
          }
          moonx "moonbit-community/proton_cli@$($Matches[1])" setup

      - name: Build Windows app
        env:
          CL: /bigobj
        run: moon run ./desktop/package/windows --target native -- --release --target app

      - name: Test Windows background job paths and retained reads
        env:
          CL: /bigobj
        run: |
          # The test executable lives outside the packaged app, so Windows
          # cannot find its linked Proton/CEF DLLs beside the executable.
          $runtimeDirs = Get-ChildItem desktop/dist/seekmoon -Recurse -Filter *.dll |
            Select-Object -ExpandProperty DirectoryName -Unique
          if (-not $runtimeDirs) { throw 'Packaged app contains no runtime DLLs' }
          # The DLL scan also finds MoonBit's bin directory. Its packaged core
          # is initialized on app startup, so keep tests and their children on
          # the CI installation.
          $ciMoon = (Get-Command moon -CommandType Application | Select-Object -First 1).Source
          $env:PATH = (Split-Path $ciMoon) + ';' + ($runtimeDirs -join ';') + ';' + $env:PATH
          & $ciMoon test desktop/backend/engine/jobs_wbtest.mbt --target native

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-windows-x64
          path: desktop/dist/seekmoon/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
