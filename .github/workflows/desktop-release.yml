name: Desktop release

run-name: Desktop ${{ github.event_name == 'schedule' && 'stable' || inputs.channel }} v${{ github.event_name == 'schedule' && 'daily' || inputs.version }} by @${{ github.actor }}

on:
  # GitHub cron is UTC. These run every three hours at
  # 00:00/03:00/06:00/09:00/12:00/15:00/18:00/21:00 in Asia/Shanghai.
  schedule:
    - cron: "0 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: staging
        options:
          - staging
          - stable
      version:
        description: Version to publish, for example 0.1.8
        required: true
        type: string

# A release must finish as one upload/publish transaction. A second dispatch
# waits instead of cancelling a run that may already have uploaded its archive.
concurrency:
  group: desktop-${{ github.event_name == 'schedule' && 'stable' || inputs.channel }}-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-needed:
    name: Check for updates
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      # Manual staging/stable dispatches are explicit release requests. A
      # scheduled run only proceeds when main differs from the newest
      # successful stable run; failed releases therefore retry the same SHA.
      - name: Compare main with the latest stable release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Manual ${{ inputs.channel }} release requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          previous_sha="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-release.yml/runs" \
              -f status=success \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and (.display_title | startswith("Desktop stable ")))][0].head_sha // ""'
          )"
          if [[ -n "$previous_sha" && "$previous_sha" == "$GITHUB_SHA" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No commits since the latest successful stable release ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Stable update found: ${previous_sha:-none} -> $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

  release-macos:
    name: Sign, notarize, and publish macOS
    needs: release-needed
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APPLE_TEAM_ID: NYZ3LQ5QWC
      MACOS_SIGNING_IDENTITY: "Developer ID Application: Haoxiang Fei (NYZ3LQ5QWC)"
      NOTARY_PROFILE: openseek-${{ github.event_name == 'schedule' && 'stable' || inputs.channel }}
      OPENSEEK_API_ORIGIN: ${{ (github.event_name != 'schedule' && inputs.channel == 'staging') && 'https://openseek-api-staging.moonbitlang.cn' || 'https://openseek-api.moonbitlang.cn' }}
      RELEASE_CHANNEL: ${{ github.event_name == 'schedule' && 'stable' || inputs.channel }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Check out the Proton submodule
        run: git submodule update --init desktop/lepus

      # `cef setup` reads and populates Proton's shared user-level cache.
      - name: Cache CEF distribution
        uses: actions/cache@v4
        with:
          path: ~/.proton/cache/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/lepus/cli/cef/cef_platform.mbt') }}

      # The packager stages the seed toolchain pinned by
      # `desktop/.moonbit-version` from archives downloaded into this directory.
      - name: Cache MoonBit toolchain seed
        uses: actions/cache@v4
        with:
          path: desktop/dist/tools/moonbit
          key: moonbit-seed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/.moonbit-version') }}

      - name: Resolve release version
        id: release
        shell: bash
        env:
          MANUAL_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            current_version="$(
              curl -fsSL "$OPENSEEK_API_ORIGIN/desktop/releases/latest.json" |
                jq -er '.version | strings'
            )"
            if [[ ! "$current_version" =~ ^([0-9]{1,4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
              echo "::error::Published $RELEASE_CHANNEL version '$current_version' is not an Apple-compatible three-part version"
              exit 1
            fi

            # The macOS packager uses this version for both the visible release
            # version and CFBundleVersion, whose third component is at most two digits.
            major_version=$((10#${BASH_REMATCH[1]}))
            minor_version=$((10#${BASH_REMATCH[2]}))
            patch_version=$((10#${BASH_REMATCH[3]}))
            if (( patch_version < 99 )); then
              patch_version=$((patch_version + 1))
            elif (( minor_version < 99 )); then
              minor_version=$((minor_version + 1))
              patch_version=0
            elif (( major_version < 9999 )); then
              major_version=$((major_version + 1))
              minor_version=0
              patch_version=0
            else
              echo "::error::Cannot auto-increment maximum $RELEASE_CHANNEL version '$current_version'"
              exit 1
            fi
            release_version="$major_version.$minor_version.$patch_version"
          else
            release_version="$MANUAL_RELEASE_VERSION"
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      # Stamp only this runner's checkout. Proton reads the version from
      # moon.mod and writes it into Info.plist and proton-package.json.
      - name: Stamp release version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$RELEASE_VERSION" perl -0pi -e '
            s/^version = "[^"]+"/version = "$ENV{RELEASE_VERSION}"/m
          ' desktop/moon.mod
          expected="version = \"$RELEASE_VERSION\""
          grep -Fx "$expected" desktop/moon.mod

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      # The publish script mirrors release artifacts to OSS with ossutil 2.x,
      # pinned and installed from the official distribution.
      - name: Install ossutil
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ossutil.zip" \
            "https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-mac-arm64.zip"
          echo "058fd048f321f8c80def8b748030531646eefe3a82837bf16b581ba7d9c84ac7  $RUNNER_TEMP/ossutil.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          sudo install -m 755 \
            "$RUNNER_TEMP/ossutil/ossutil-2.3.0-mac-arm64/ossutil" \
            /usr/local/bin/ossutil
          ossutil version

      # GitHub's runner starts without the Developer ID identity available on
      # the developer Mac. Import it into an ephemeral keychain for codesign.
      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/openseek-developer-id.p12"
          signing_keychain="$RUNNER_TEMP/openseek-$RELEASE_CHANNEL.keychain-db"
          signing_keychain_password="$(openssl rand -base64 32)"
          trap 'rm -f "$certificate_path"' EXIT

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          security import "$certificate_path" \
            -k "$signing_keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
          security find-identity -v -p codesigning "$signing_keychain" |
            grep -F "$MACOS_SIGNING_IDENTITY"
          echo "SIGNING_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"

      # notarytool validates the Apple account credentials while saving this
      # profile. The runner is disposable, so the profile is never persisted.
      - name: Configure Apple notarization
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, and notarize macOS artifacts
        shell: bash
        run: |
          moon -C desktop run --target native package/macos -- \
            --release \
            --target dmg \
            --target zip \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --notarize "$NOTARY_PROFILE"

      # Keep one compressed browser archive beside the desktop artifacts. The
      # API extracts this exact archive when the release is published.
      - name: Build browser release artifact
        shell: bash
        run: |
          set -euo pipefail
          moon -C desktop run --target native package/browser -- --release
          test -f desktop/dist/browser/index.html
          test -f desktop/dist/browser/browser.js
          COPYFILE_DISABLE=1 tar \
            -C desktop/dist \
            -czf desktop/dist/SeekMoon.browser.tar.gz \
            browser

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-macos-arm64-v${{ steps.release.outputs.version }}
          path: |
            desktop/dist/SeekMoon.app.zip
            desktop/dist/SeekMoon.dmg
            desktop/dist/SeekMoon.browser.tar.gz
          if-no-files-found: error
          retention-days: 14

      # Every artifact is uploaded once. The same publish request regenerates
      # latest.json and extracts/selects the browser archive on the server.
      - name: Publish release
        shell: bash
        env:
          OPENSEEK_DEPLOY_TOKEN: ${{ secrets.OPENSEEK_DEPLOY_TOKEN }}
          OPENSEEK_OSS_BUCKET: ${{ secrets.OPENSEEK_OSS_BUCKET }}
          OPENSEEK_OSS_REGION: ${{ secrets.OPENSEEK_OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OPENSEEK_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OPENSEEK_OSS_ACCESS_KEY_SECRET }}
        run: |
          desktop/scripts/publish-release.sh upload \
            desktop/dist/SeekMoon.app.zip \
            macos-arm64
          desktop/scripts/publish-release.sh upload \
            desktop/dist/SeekMoon.dmg \
            macos-arm64-dmg
          desktop/scripts/publish-release.sh upload \
            desktop/dist/SeekMoon.browser.tar.gz \
            browser
          desktop/scripts/publish-release.sh publish "v$RELEASE_VERSION"

      - name: Verify release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(curl -fsSL "$OPENSEEK_API_ORIGIN/desktop/releases/latest.json")"
          jq -e --arg version "$RELEASE_VERSION" '.version == $version' \
            <<< "$manifest"

          archive_sha256="$(shasum -a 256 desktop/dist/SeekMoon.app.zip | cut -d' ' -f1)"
          dmg_sha256="$(shasum -a 256 desktop/dist/SeekMoon.dmg | cut -d' ' -f1)"
          browser_sha256="$(shasum -a 256 desktop/dist/SeekMoon.browser.tar.gz | cut -d' ' -f1)"

          # The manifest is the client contract: whatever URL it names for a
          # platform is what the updater and the download page fetch. URLs
          # are read back rather than reconstructed, so the same check holds
          # whether the server's releases base URL points at this API or at
          # the OSS-backed CDN — each entry's digest must match the artifact
          # built here, and so must the bytes its URL actually serves.
          platform_url() {
            jq -er --arg key "$1" '.platforms[$key].url' <<< "$manifest"
          }
          verify_platform() {
            local key="$1" sha256="$2"
            local url manifest_sha256 served served_sha256
            url="$(platform_url "$key")"
            manifest_sha256="$(jq -er --arg key "$key" '.platforms[$key].sha256' <<< "$manifest")"
            if [[ "$manifest_sha256" != "$sha256" ]]; then
              echo "::error::Manifest sha256 for $key does not match the built artifact"
              exit 1
            fi
            served="$RUNNER_TEMP/openseek-release-$key"
            curl -fsSL --retry 3 -o "$served" "$url"
            served_sha256="$(shasum -a 256 "$served" | cut -d' ' -f1)"
            rm -f "$served"
            if [[ "$served_sha256" != "$sha256" ]]; then
              echo "::error::Bytes served for $key at $url do not match the built artifact"
              exit 1
            fi
            echo "$key ok: $url"
          }

          # The updater installs from the bare macOS platform key. The DMG and
          # browser bundle are separate release artifacts for manual install
          # and later browser deployment respectively.
          verify_platform macos-arm64 "$archive_sha256"
          verify_platform macos-arm64-dmg "$dmg_sha256"
          verify_platform browser "$browser_sha256"

          browser_manifest="$(curl -fsSL "$OPENSEEK_API_ORIGIN/browser/releases/current.json")"
          browser_base_url="$OPENSEEK_API_ORIGIN/console/releases/v$RELEASE_VERSION"
          jq -e \
            --arg version "$RELEASE_VERSION" \
            '.version == $version' \
            <<< "$browser_manifest"

          response_headers="$RUNNER_TEMP/openseek-console-headers"
          curl -fsS -D "$response_headers" -o /dev/null \
            "$OPENSEEK_API_ORIGIN/console/"
          if ! tr -d '\r' < "$response_headers" | grep -Fqx \
            "location: /console/releases/v${RELEASE_VERSION}/index.html"; then
            echo "::error::/console/ did not select browser v$RELEASE_VERSION"
            cat "$response_headers"
            exit 1
          fi

          for file in index.html browser.js; do
            served="$RUNNER_TEMP/openseek-browser-$file"
            curl -fsSL "$browser_base_url/$file" -o "$served"
            served_sha256="$(shasum -a 256 "$served" | cut -d' ' -f1)"
            local_sha256="$(shasum -a 256 "desktop/dist/browser/$file" | cut -d' ' -f1)"
            if [[ "$served_sha256" != "$local_sha256" ]]; then
              echo "::error::Served $file digest does not match the release bundle"
              exit 1
            fi
          done

          {
            echo "## Desktop $RELEASE_CHANNEL release"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Updater ZIP: $(platform_url macos-arm64)"
            echo "- ZIP SHA-256: \`$archive_sha256\`"
            echo "- Installer DMG: $(platform_url macos-arm64-dmg)"
            echo "- DMG SHA-256: \`$dmg_sha256\`"
            echo "- Browser bundle: $(platform_url browser)"
            echo "- Browser SHA-256: \`$browser_sha256\`"
            echo "- Browser console: $browser_base_url/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
