name: Desktop release

run-name: Desktop stable v${{ github.event_name == 'schedule' && 'daily' || inputs.version }} by @${{ github.actor }}

on:
  # Runs once a day at 14:00 in Asia/Shanghai.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.1.8
        required: true
        type: string

# A release must finish as one upload/publish transaction. A second dispatch
# waits instead of cancelling a run that may already have uploaded its archive.
concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-needed:
    name: Check for updates
    runs-on: ubuntu-24.04
    env:
      OPENSEEK_API_ORIGIN: https://seekmoon.moonbitlang.com
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Manual dispatches are explicit release requests. A
      # scheduled run only proceeds when main differs from the newest
      # successful stable run; failed releases therefore retry the same SHA.
      - name: Compare main with the latest stable release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Manual release requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          previous_sha="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-release.yml/runs" \
              -f status=success \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and (.display_title | startswith("Desktop stable ")))][0].head_sha // ""'
          )"
          if [[ -n "$previous_sha" && "$previous_sha" == "$GITHUB_SHA" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No commits since the latest successful stable release ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Stable update found: ${previous_sha:-none} -> $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Every platform packager stamps the same version, so it is resolved
      # once here rather than on whichever runner happens to build first.
      - name: Resolve release version
        id: release
        if: steps.check.outputs.release == 'true'
        shell: bash
        env:
          MANUAL_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            current_version="$(
              curl -fsSL "$OPENSEEK_API_ORIGIN/desktop/releases/latest.json" |
                jq -er '.version | strings'
            )"
            if [[ ! "$current_version" =~ ^([0-9]{1,4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
              echo "::error::Published version '$current_version' is not an Apple-compatible three-part version"
              exit 1
            fi

            # The macOS packager uses this version for both the visible release
            # version and CFBundleVersion, whose third component is at most two digits.
            major_version=$((10#${BASH_REMATCH[1]}))
            minor_version=$((10#${BASH_REMATCH[2]}))
            patch_version=$((10#${BASH_REMATCH[3]}))
            if (( patch_version < 99 )); then
              patch_version=$((patch_version + 1))
            elif (( minor_version < 99 )); then
              minor_version=$((minor_version + 1))
              patch_version=0
            elif (( major_version < 9999 )); then
              major_version=$((major_version + 1))
              minor_version=0
              patch_version=0
            else
              echo "::error::Cannot auto-increment maximum version '$current_version'"
              exit 1
            fi
            release_version="$major_version.$minor_version.$patch_version"
          else
            release_version="$MANUAL_RELEASE_VERSION"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$release_version." >> "$GITHUB_STEP_SUMMARY"

  # The Browser bundle is platform-neutral. Building it apart from the macOS
  # packager lets Android package the same bytes without waiting for Apple
  # signing and notarization. The Browser release workflow owns the build and,
  # called with a version, only builds: this release's publish job selects the
  # console together with the Desktop manifest.
  release-browser:
    name: Browser
    needs: release-needed
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    uses: ./.github/workflows/browser-release.yml
    with:
      version: ${{ needs.release-needed.outputs.version }}

  release-macos:
    name: Build, sign, and notarize macOS
    needs: release-needed
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APPLE_TEAM_ID: NYZ3LQ5QWC
      MACOS_SIGNING_IDENTITY: "Developer ID Application: Haoxiang Fei (NYZ3LQ5QWC)"
      NOTARY_PROFILE: openseek-release
      RELEASE_VERSION: ${{ needs.release-needed.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Proton 0.2 installs its immutable runtime and versioned helper in the
      # shared user-level store selected by the dependency in desktop/app/moon.mod.
      - name: Cache Proton runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/app/moon.mod') }}

      # The packager stages the seed toolchain pinned by
      # `desktop/.moonbit-version` from archives downloaded into this directory.
      - name: Cache MoonBit toolchain seed
        uses: actions/cache@v4
        with:
          path: desktop/target/moonbit/cache
          key: moonbit-seed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/.moonbit-version') }}

      # Stamp only this runner's checkout. The three Desktop module manifests
      # and Proton's package.version must agree before packaging.
      - name: Stamp release version
        shell: bash
        run: node desktop/scripts/release.mjs stamp "$RELEASE_VERSION"

      # Build with the same pinned toolchain as CI and the bundled seed.
      - name: Set up MoonBit
        run: |
          version="$(cat "$GITHUB_WORKSPACE/desktop/.moonbit-version")"
          test -n "$version"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      # GitHub's runner starts without the Developer ID identity available on
      # the developer Mac. Import it into an ephemeral keychain for codesign.
      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/openseek-developer-id.p12"
          signing_keychain="$RUNNER_TEMP/openseek-release.keychain-db"
          signing_keychain_password="$(openssl rand -base64 32)"
          trap 'rm -f "$certificate_path"' EXIT

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          security import "$certificate_path" \
            -k "$signing_keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
          security find-identity -v -p codesigning "$signing_keychain" |
            grep -F "$MACOS_SIGNING_IDENTITY"
          echo "SIGNING_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"

      # notarytool validates the Apple account credentials while saving this
      # profile. The runner is disposable, so the profile is never persisted.
      - name: Configure Apple notarization
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, and notarize macOS artifacts
        shell: bash
        run: |
          moon -C desktop run package/macos --target native -- \
            --release \
            --no-open \
            --target dmg \
            --target zip \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --notarize "$NOTARY_PROFILE"

      # Only a hand-off to the publish job, which attaches the archives to the
      # GitHub release.
      - name: Hand macOS archives to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-macos-arm64-v${{ needs.release-needed.outputs.version }}-build
          overwrite: true
          path: |
            desktop/dist/SeekMoon.app.zip
            desktop/dist/SeekMoon.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

  release-android:
    name: Build and sign Android
    needs: [release-needed, release-browser]
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.release-needed.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired `tools` package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Stamp release version
        run: node desktop/scripts/release.mjs stamp "$RELEASE_VERSION"

      # Package the exact Browser bytes built for this release, without a
      # second frontend build or downloading the large macOS application.
      - name: Collect Browser archive
        uses: actions/download-artifact@v4
        with:
          name: SeekMoon-browser-v${{ needs.release-needed.outputs.version }}-build
          path: desktop/dist

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPENSEEK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENSEEK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENSEEK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export OPENSEEK_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/openseek-android-release.jks"
          trap 'rm -f "$OPENSEEK_ANDROID_KEYSTORE_PATH"' EXIT
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64 and Android signing password/alias secrets before releasing.'
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$OPENSEEK_ANDROID_KEYSTORE_PATH"
          node android/build.mjs --release --browser-bundle desktop/dist/SeekMoon.browser.tar.gz

      - name: Verify APK signature and version
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=desktop/dist/SeekMoon-android.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/android-badging.txt"
          grep -F "package: name='com.moonbit.openseek.connect'" "$RUNNER_TEMP/android-badging.txt"
          grep -F "versionName='$RELEASE_VERSION'" "$RUNNER_TEMP/android-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/android-badging.txt"; then
            echo '::error::Release APK must not be debuggable'
            exit 1
          fi

      - name: Hand Android APK to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-android-v${{ needs.release-needed.outputs.version }}-build
          overwrite: true
          path: desktop/dist/SeekMoon-android.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-windows:
    name: Build Windows
    needs: release-needed
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.release-needed.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed: $LASTEXITCODE" }
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          $nsisDir >> $env:GITHUB_PATH
          & "$nsisDir\makensis.exe" /VERSION

      # Build with the same pinned toolchain as CI and the bundled seed.
      - name: Set up MoonBit
        run: |
          $env:MOONBIT_INSTALL_VERSION = (Get-Content "$env:GITHUB_WORKSPACE/desktop/.moonbit-version" -Raw -ErrorAction Stop).Trim()
          if (-not $env:MOONBIT_INSTALL_VERSION) { throw "desktop/.moonbit-version is empty" }
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Cache Proton runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/app/moon.mod') }}

      - name: Cache MoonBit toolchain seed
        uses: actions/cache@v4
        with:
          path: desktop/target/moonbit/cache
          key: moonbit-seed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/.moonbit-version') }}

      - name: Assemble Proton CEF runtime
        working-directory: desktop
        run: |
          $manifest = Get-Content app/moon.mod -Raw
          if ($manifest -notmatch '"moonbit-community/proton@([^"]+)"') {
            throw 'desktop/app/moon.mod does not pin Proton'
          }
          moonx "moonbit-community/proton_cli@$($Matches[1])" setup

      # After the cache steps: stamping edits app/moon.mod, whose hash keys
      # the Proton runtime cache.
      - name: Stamp release version
        shell: bash
        run: node desktop/scripts/release.mjs stamp "$RELEASE_VERSION"

      - name: Build Windows installer
        env:
          # Generated desktop C can exceed MSVC's default object section limit.
          CL: /bigobj
        run: moon run ./desktop/package/windows --target native -- --release --target installer

      # Proton names the installer after the executable. The release keeps
      # the platform in the filename, matching the other download names.
      - name: Rename Windows installer
        shell: bash
        run: mv desktop/dist/seekmoon-setup.exe desktop/dist/SeekMoon-windows-x64-setup.exe

      # Only a hand-off to the publish job, which attaches the archives to the
      # GitHub release.
      - name: Hand Windows installer to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-windows-x64-v${{ needs.release-needed.outputs.version }}-build
          overwrite: true
          path: desktop/dist/SeekMoon-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The one job that can write releases and holds the deploy token. It builds
  # nothing: every archive arrives from a build job above.
  release-publish:
    name: Publish
    needs: [release-needed, release-browser, release-windows, release-macos, release-android]
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A console-only Browser release takes the same group, so it cannot move
    # the console between this publish and its verification. `queue: max`
    # keeps this job waiting behind several console releases instead of
    # letting the next one cancel it.
    concurrency:
      group: browser-console-publish
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
    env:
      OPENSEEK_API_ORIGIN: https://seekmoon.moonbitlang.com
      RELEASE_VERSION: ${{ needs.release-needed.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The release script refuses to upload or publish a version other than
      # the checkout's own, so this checkout is stamped like the builders'.
      - name: Stamp release version
        shell: bash
        run: node desktop/scripts/release.mjs stamp "$RELEASE_VERSION"

      # Every platform's archives land in dist/ so the upload, publish, and
      # verification below cover the whole release.
      - name: Collect Browser archive
        uses: actions/download-artifact@v4
        with:
          name: SeekMoon-browser-v${{ needs.release-needed.outputs.version }}-build
          path: desktop/dist

      - name: Collect macOS archives
        uses: actions/download-artifact@v4
        with:
          name: SeekMoon-macos-arm64-v${{ needs.release-needed.outputs.version }}-build
          path: desktop/dist

      - name: Collect Windows installer
        uses: actions/download-artifact@v4
        with:
          name: SeekMoon-windows-x64-v${{ needs.release-needed.outputs.version }}-build
          path: desktop/dist

      - name: Collect Android APK
        uses: actions/download-artifact@v4
        with:
          name: SeekMoon-android-v${{ needs.release-needed.outputs.version }}-build
          path: desktop/dist

      # Attach the archives to a draft GitHub release, tagged at this commit.
      # Until the release is public, a retry replaces nondeterministic
      # rebuilds; a public release restores its exact bytes instead.
      - name: Upload release to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENSEEK_DEPLOY_TOKEN: ${{ secrets.OPENSEEK_DEPLOY_TOKEN }}
        run: node desktop/scripts/release.mjs upload "v$RELEASE_VERSION"

      # Publish makes the GitHub release public, then sends filenames and
      # digests to the API. The API selects the staged Browser version and
      # atomically replaces its own latest.json.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENSEEK_DEPLOY_TOKEN: ${{ secrets.OPENSEEK_DEPLOY_TOKEN }}
        run: node desktop/scripts/release.mjs publish "v$RELEASE_VERSION"

      # The release as a user meets it: the manifest, the public download URLs,
      # and the console, compared with the archives in dist/. Needs no
      # credentials; the summary lands on the run page.
      - name: Verify release
        shell: bash
        run: node desktop/scripts/release.mjs verify "v$RELEASE_VERSION"
