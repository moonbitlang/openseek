name: Desktop release

run-name: Desktop ${{ github.event_name == 'schedule' && 'stable' || inputs.channel }} v${{ github.event_name == 'schedule' && 'daily' || inputs.version }} by @${{ github.actor }}

on:
  # Runs once a day at 14:00 in Asia/Shanghai.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: staging
        options:
          - staging
          - stable
      version:
        description: Version to publish, for example 0.1.8
        required: true
        type: string

# A release must finish as one upload/publish transaction. A second dispatch
# waits instead of cancelling a run that may already have uploaded its archive.
concurrency:
  group: desktop-${{ github.event_name == 'schedule' && 'stable' || inputs.channel }}-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-needed:
    name: Check for updates
    runs-on: ubuntu-latest
    env:
      OPENSEEK_API_ORIGIN: ${{ (github.event_name != 'schedule' && inputs.channel == 'staging') && 'https://openseek-api-staging.moonbitlang.cn' || 'https://openseek-api.moonbitlang.cn' }}
      RELEASE_CHANNEL: ${{ github.event_name == 'schedule' && 'stable' || inputs.channel }}
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Manual staging/stable dispatches are explicit release requests. A
      # scheduled run only proceeds when main differs from the newest
      # successful stable run; failed releases therefore retry the same SHA.
      - name: Compare main with the latest stable release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Manual ${{ inputs.channel }} release requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          previous_sha="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-release.yml/runs" \
              -f status=success \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and (.display_title | startswith("Desktop stable ")))][0].head_sha // ""'
          )"
          if [[ -n "$previous_sha" && "$previous_sha" == "$GITHUB_SHA" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No commits since the latest successful stable release ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Stable update found: ${previous_sha:-none} -> $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Every platform packager stamps the same version, so it is resolved
      # once here rather than on whichever runner happens to build first.
      - name: Resolve release version
        id: release
        if: steps.check.outputs.release == 'true'
        shell: bash
        env:
          MANUAL_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            current_version="$(
              curl -fsSL "$OPENSEEK_API_ORIGIN/desktop/releases/latest.json" |
                jq -er '.version | strings'
            )"
            if [[ ! "$current_version" =~ ^([0-9]{1,4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
              echo "::error::Published $RELEASE_CHANNEL version '$current_version' is not an Apple-compatible three-part version"
              exit 1
            fi

            # The macOS packager uses this version for both the visible release
            # version and CFBundleVersion, whose third component is at most two digits.
            major_version=$((10#${BASH_REMATCH[1]}))
            minor_version=$((10#${BASH_REMATCH[2]}))
            patch_version=$((10#${BASH_REMATCH[3]}))
            if (( patch_version < 99 )); then
              patch_version=$((patch_version + 1))
            elif (( minor_version < 99 )); then
              minor_version=$((minor_version + 1))
              patch_version=0
            elif (( major_version < 9999 )); then
              major_version=$((major_version + 1))
              minor_version=0
              patch_version=0
            else
              echo "::error::Cannot auto-increment maximum $RELEASE_CHANNEL version '$current_version'"
              exit 1
            fi
            release_version="$major_version.$minor_version.$patch_version"
          else
            release_version="$MANUAL_RELEASE_VERSION"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$release_version." >> "$GITHUB_STEP_SUMMARY"

  release-macos:
    name: Build, sign, and notarize macOS
    needs: release-needed
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APPLE_TEAM_ID: NYZ3LQ5QWC
      MACOS_SIGNING_IDENTITY: "Developer ID Application: Haoxiang Fei (NYZ3LQ5QWC)"
      NOTARY_PROFILE: openseek-${{ github.event_name == 'schedule' && 'stable' || inputs.channel }}
      RELEASE_CHANNEL: ${{ github.event_name == 'schedule' && 'stable' || inputs.channel }}
      RELEASE_VERSION: ${{ needs.release-needed.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Proton 0.2 installs its immutable runtime and versioned helper in the
      # shared user-level store selected by the dependency in desktop/moon.mod.
      - name: Cache Proton runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/moon.mod') }}

      # The packager stages the seed toolchain pinned by
      # `desktop/.moonbit-version` from archives downloaded into this directory.
      - name: Cache MoonBit toolchain seed
        uses: actions/cache@v4
        with:
          path: desktop/target/moonbit/cache
          key: moonbit-seed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/.moonbit-version') }}

      # Stamp only this runner's checkout. OpenSeek's shared build program uses
      # moon.mod, while Proton 0.2 reads package.version from the project config.
      - name: Stamp release version
        shell: bash
        run: node desktop/scripts/release.mjs stamp "$RELEASE_VERSION"

      # Stable, matching CI. This is the toolchain that BUILDS the app, not
      # the seed it ships (that one is pinned by `desktop/.moonbit-version`), but
      # if the two channels differed then a change compiling on the channel CI
      # runs could still break the release build, and nothing would catch it
      # until a release ran.
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      # GitHub's runner starts without the Developer ID identity available on
      # the developer Mac. Import it into an ephemeral keychain for codesign.
      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/openseek-developer-id.p12"
          signing_keychain="$RUNNER_TEMP/openseek-$RELEASE_CHANNEL.keychain-db"
          signing_keychain_password="$(openssl rand -base64 32)"
          trap 'rm -f "$certificate_path"' EXIT

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          security import "$certificate_path" \
            -k "$signing_keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
          security find-identity -v -p codesigning "$signing_keychain" |
            grep -F "$MACOS_SIGNING_IDENTITY"
          echo "SIGNING_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"

      # notarytool validates the Apple account credentials while saving this
      # profile. The runner is disposable, so the profile is never persisted.
      - name: Configure Apple notarization
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, and notarize macOS artifacts
        shell: bash
        run: |
          moon -C desktop run package/macos --target native -- \
            --release \
            --no-open \
            --target dmg \
            --target zip \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --notarize "$NOTARY_PROFILE"

      - name: Verify packaged application version
        shell: bash
        run: |
          set -euo pipefail
          test "$(plutil -extract CFBundleShortVersionString raw \
            desktop/dist/SeekMoon.app/Contents/Info.plist)" = "$RELEASE_VERSION"
          jq -e --arg version "$RELEASE_VERSION" \
            '.version == $version and .bundle_version == $version' \
            desktop/dist/SeekMoon.app/Contents/Resources/proton-package.json

      # Keep one compressed Browser archive beside the Desktop artifacts. OSS
      # stores it as an immutable release artifact; the API receives the same
      # small archive only because `/console/` must remain on the API origin.
      - name: Build browser release artifact
        shell: bash
        run: |
          set -euo pipefail
          moon -C desktop run package/browser --target native -- --release
          test -f desktop/dist/browser/index.html
          test -f desktop/dist/browser/browser.js
          COPYFILE_DISABLE=1 tar \
            -C desktop/dist \
            -czf desktop/dist/SeekMoon.browser.tar.gz \
            browser

      # Only a hand-off to the publish job. The downloadable release artifact
      # is uploaded there, after OSS has settled which bytes are canonical.
      - name: Hand macOS and Browser archives to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-macos-arm64-v${{ needs.release-needed.outputs.version }}-build
          overwrite: true
          path: |
            desktop/dist/SeekMoon.app.zip
            desktop/dist/SeekMoon.dmg
            desktop/dist/SeekMoon.browser.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

  release-windows:
    name: Build Windows
    needs: release-needed
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.release-needed.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Stable, matching CI, for the same reason as the macOS job below.
      - name: Set up MoonBit
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Cache Proton runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/moon.mod') }}

      - name: Cache MoonBit toolchain seed
        uses: actions/cache@v4
        with:
          path: desktop/target/moonbit/cache
          key: moonbit-seed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/.moonbit-version') }}

      - name: Assemble Proton CEF runtime
        working-directory: desktop
        run: |
          $manifest = Get-Content moon.mod -Raw
          if ($manifest -notmatch '"moonbit-community/proton@([^"]+)"') {
            throw 'desktop/moon.mod does not pin Proton'
          }
          moonx "moonbit-community/proton_cli@$($Matches[1])" cef setup

      # After the cache steps: stamping edits moon.mod, whose hash keys the
      # Proton runtime cache.
      - name: Stamp release version
        shell: bash
        run: node desktop/scripts/release.mjs stamp "$RELEASE_VERSION"

      - name: Build Windows ZIP
        # Keep the unpacked application for the version check below. Proton
        # removes it after packaging when only the ZIP format is requested.
        run: moon run ./desktop/package/windows --target native -- --release --target app --target zip

      # Proton names the portable ZIP after the executable. The release keeps
      # the platform in the filename, matching the other download names.
      - name: Verify packaged application version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const manifest = JSON.parse(await readFile("desktop/dist/seekmoon/proton-package.json", "utf8"));
            const version = process.env.RELEASE_VERSION;
            if (manifest.version !== version || manifest.bundle_version !== version) {
              throw new Error(`packaged ${manifest.version} (bundle ${manifest.bundle_version}), expected ${version}`);
            }
          '
          mv desktop/dist/seekmoon.zip desktop/dist/SeekMoon-windows-x64.zip

      # Only a hand-off to the publish job. The downloadable release artifact
      # is uploaded there, after OSS has settled which bytes are canonical.
      - name: Hand Windows ZIP to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-windows-x64-v${{ needs.release-needed.outputs.version }}-build
          overwrite: true
          path: desktop/dist/SeekMoon-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The one job that holds the OSS credentials and the deploy token. It builds
  # nothing: every archive arrives from a build job above.
  release-publish:
    name: Publish
    needs: [release-needed, release-windows, release-macos]
    if: github.ref == 'refs/heads/main' && needs.release-needed.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENSEEK_API_ORIGIN: ${{ (github.event_name != 'schedule' && inputs.channel == 'staging') && 'https://openseek-api-staging.moonbitlang.cn' || 'https://openseek-api.moonbitlang.cn' }}
      RELEASE_VERSION: ${{ needs.release-needed.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The release script refuses to upload or publish a version other than
      # the checkout's own, so this checkout is stamped like the builders'.
      - name: Stamp release version
        shell: bash
        run: node desktop/scripts/release.mjs stamp "$RELEASE_VERSION"

      # The release script uploads artifacts to OSS with ossutil 2.x, pinned
      # and installed from the official distribution.
      - name: Install ossutil
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ossutil.zip" \
            "https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip"
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $RUNNER_TEMP/ossutil.zip" \
            | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          sudo install -m 755 \
            "$RUNNER_TEMP/ossutil/ossutil-2.3.0-linux-amd64/ossutil" \
            /usr/local/bin/ossutil
          ossutil version

      # Every platform's archives land in dist/ so the upload, publish, and
      # verification below cover the whole release.
      - name: Collect macOS and Browser archives
        uses: actions/download-artifact@v4
        with:
          name: SeekMoon-macos-arm64-v${{ needs.release-needed.outputs.version }}-build
          path: desktop/dist

      - name: Collect Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: SeekMoon-windows-x64-v${{ needs.release-needed.outputs.version }}-build
          path: desktop/dist

      # Upload artifacts before publication. Until API publish succeeds, a
      # retry may replace nondeterministic rebuilds; a published Browser
      # version restores the exact OSS bytes instead.
      - name: Upload release to OSS
        shell: bash
        env:
          OPENSEEK_DEPLOY_TOKEN: ${{ secrets.OPENSEEK_DEPLOY_TOKEN }}
          OPENSEEK_OSS_BUCKET: ${{ secrets.OPENSEEK_OSS_BUCKET }}
          OPENSEEK_OSS_REGION: ${{ secrets.OPENSEEK_OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OPENSEEK_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OPENSEEK_OSS_ACCESS_KEY_SECRET }}
        run: |
          node desktop/scripts/release.mjs upload "v$RELEASE_VERSION"

      # A retry of an API-published version replaces this run's nondeterministic
      # rebuilds with the exact OSS objects before reaching here. Keep those
      # canonical bytes as the downloadable Actions artifacts too.
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-macos-arm64-v${{ needs.release-needed.outputs.version }}
          overwrite: true
          path: |
            desktop/dist/SeekMoon.app.zip
            desktop/dist/SeekMoon.dmg
            desktop/dist/SeekMoon.browser.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeekMoon-windows-x64-v${{ needs.release-needed.outputs.version }}
          overwrite: true
          path: desktop/dist/SeekMoon-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Publish sends filenames and digests to the API. The API selects the
      # staged Browser version and atomically replaces its own latest.json; it
      # does not receive the ZIPs or the DMG.
      - name: Publish release
        shell: bash
        env:
          OPENSEEK_DEPLOY_TOKEN: ${{ secrets.OPENSEEK_DEPLOY_TOKEN }}
          OPENSEEK_OSS_BUCKET: ${{ secrets.OPENSEEK_OSS_BUCKET }}
          OPENSEEK_OSS_REGION: ${{ secrets.OPENSEEK_OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OPENSEEK_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OPENSEEK_OSS_ACCESS_KEY_SECRET }}
        run: |
          node desktop/scripts/release.mjs publish "v$RELEASE_VERSION"

      # The release as a user meets it: the manifest, the public download URLs,
      # and the console, compared with the archives in dist/. Needs no
      # credentials; the summary lands on the run page.
      - name: Verify release
        shell: bash
        run: node desktop/scripts/release.mjs verify "v$RELEASE_VERSION"
