name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer PR head supersedes its older checks. Keep main runs complete so every
# merged commit still receives a full CI result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.moonbit-channel }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Run stable targets independently (fail-fast: false), while the
      # native/JS split lets the two test suites run in parallel.
      fail-fast: false
      matrix:
        moonbit-channel: [stable]
        target: [native, js]
        include:
          - moonbit-channel: stable
            moonbit-version: latest
            deny-warn: "--deny-warn"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (${{ matrix.moonbit-channel }})
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit-version }}"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version
        run: |
          moon version --all

      - name: Update MoonBit package registry
        run: moon update

      # Proton comes from the registry, so the version it is pinned to lives in
      # desktop/moon.mod and nowhere else. Read it back here rather than
      # repeating it, and reuse it for both the CEF cache key and the CLI.
      - name: Resolve pinned Proton version
        id: proton
        run: |
          version="$(sed -n 's/.*"moonbit-community\/proton@\([^"]*\)".*/\1/p' desktop/moon.mod)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pull requests may restore the default branch's cache, but their own
      # merge-ref caches are private to that PR and cannot warm other branches.
      # Proton 0.2 stores the immutable runtime and versioned helper here. The
      # module prebuild resolves this store for both native and JS tests.
      - name: Restore Proton runtime
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.proton.outputs.version }}

      - name: Check formatting
        # Run the repository's one canonical formatter once on stable/native.
        # A second toolchain channel could require a different committed form.
        if: matrix.moonbit-channel == 'stable' && matrix.target == 'native'
        run: moon fmt --check

      - name: Check ${{ matrix.target }} target
        # This is the local-dependency integration check: desktop must compile
        # against the editor member from this checkout. Keeping the target
        # explicit also makes each matrix row own one complete check/test pair;
        # stable denies warnings across the complete integrated workspace.
        run: moon check --target ${{ matrix.target }} ${{ matrix.deny-warn }}

      - name: Check generated interfaces
        # Generated interfaces are toolchain-versioned, so compare them only
        # with the stable channel that owns the committed `.mbti`. This covers
        # the editor's public interfaces from the same checkout too. Ignore
        # blank-only formatter drift, but still reject content changes and new
        # `.mbti`.
        if: matrix.target == 'native'
        run: |
          moon info
          untracked_mbti="$(git ls-files --others --exclude-standard -- '*.mbti')"
          if [ -n "$untracked_mbti" ] ||
            ! git diff --quiet --ignore-blank-lines -- '*.mbti'; then
            git status --short -- '*.mbti'
            git diff --ignore-blank-lines -- '*.mbti'
            exit 1
          fi

      # Proton's Linux prebuild queries GTK and X11 while producing its native
      # link configuration. The shared libraries are on the runner image, but
      # their pkg-config metadata and headers come from the development packages.
      - name: Install Proton Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libx11-dev

      # `cef setup` installs the release-selected runtime and subprocess helper
      # into Proton's user-level immutable store. Moon invokes Proton's module
      # prebuild for both test targets, so both matrix rows need the store even
      # though JS tests never open a native window. Setup is idempotent after a
      # cache hit.
      - name: Assemble Proton CEF runtime
        run: >-
          moonx "moonbit-community/proton_cli@${{ steps.proton.outputs.version }}"
          cef setup

      # The stable/native main job is the sole Linux writer. PR jobs remain
      # restore-only, and no second channel races to reserve the same key.
      - name: Save Proton runtime
        if: >-
          github.event_name == 'push' &&
          matrix.moonbit-channel == 'stable' &&
          matrix.target == 'native' &&
          steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      - name: Test native target
        # No Xvfb: nothing here initializes CEF or opens a window. That was
        # Proton's own windowed test suite, which left this workspace when
        # Proton became a registry dependency; loading libproton needs the
        # libraries above, not a display.
        if: matrix.target == 'native'
        run: moon test --target native

      - name: Test JS target
        # Run JS-only package tests from the same root workspace. These do not
        # create Proton windows and therefore do not need Xvfb.
        if: matrix.target == 'js'
        run: moon test --target js

      - name: Cram (offline CLI docs)
        if: matrix.target == 'native'
        run: moon cram test tests/cram

  # cmd/viz_app is a separate MoonBit module and owns its browser test runner.
  # Keep it out of Desktop's recipe so either application can be tested alone.
  viz-e2e:
    name: viz e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/viz_app/e2e/package-lock.json

      - name: Update MoonBit dependencies
        run: moon update

      # The workspace includes Desktop, so Proton's module prebuild runs while
      # Viz builds its JS target too. Keep this job on the version pinned by
      # Desktop instead of duplicating the dependency version in CI.
      - name: Resolve pinned Proton version
        id: proton
        run: |
          version="$(sed -n 's/.*"moonbit-community\/proton@\([^"]*\)".*/\1/p' desktop/moon.mod)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Proton runtime
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.proton.outputs.version }}

      # Proton's prebuild queries pkg-config even for the workspace's JS build.
      # Playwright installs browser libraries, not these development metadata.
      - name: Install Proton Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libx11-dev

      - name: Assemble Proton CEF runtime
        run: >-
          moonx "moonbit-community/proton_cli@${{ steps.proton.outputs.version }}"
          cef setup

      - name: Install E2E dependencies
        working-directory: cmd/viz_app/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: cmd/viz_app/e2e
        run: npx playwright install --with-deps chromium

      - name: Build session viewer
        working-directory: cmd/viz_app
        run: moon build --target js

      - name: Run session viewer E2E tests
        working-directory: cmd/viz_app/e2e
        run: npm test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: viz-playwright-report
          path: |
            cmd/viz_app/e2e/playwright-report
            cmd/viz_app/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The Linux rows above own the canonical native/JS pair, the committed
  # `.mbti` gate, and the POSIX cram suite. This job carries the native
  # contract onto Windows, where MoonBit compiles through MSVC — a path the
  # Linux rows cannot exercise.
  #
  # Tests that assume POSIX paths, symlink privileges, or unix shell
  # semantics are gated with `#cfg(not(platform="windows"))` next to their
  # declarations (plus the odd helper/import that only they used); each gate
  # names the Windows-port work that would re-enable it. The full native
  # suite runs here and is green on Windows.
  check-windows:
    name: check (windows, native)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      # actions/checkout inherits the runner's autocrlf on Windows, which
      # rewrites committed LFs; the repository has no .gitattributes and its
      # canonical tree (fmt, cram, `.mbti`) is LF. Pin autocrlf before the
      # checkout so the working tree stays byte-identical to the commit.
      - name: Pin Git line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (stable)
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check native target
        # The whole integrated workspace compiles on Windows — including the
        # desktop member — the local-dependency integration gate the Linux
        # rows perform for their own target. No CEF runtime is needed:
        # checks never link. Warnings are tolerated here (Linux keeps the
        # --deny-warn gate): platform-gated tests legitimately leave some
        # imports/fields unused on Windows.
        run: moon check --target native

      # Same version read the Linux job performs; duplicated here because a
      # job cannot reach another job's step outputs.
      - name: Resolve pinned Proton version
        id: proton
        run: |
          $version = (Select-String -Path desktop/moon.mod -Pattern '"moonbit-community/proton@([^"]*)"').Matches[0].Groups[1].Value
          if (-not $version) { throw "proton version not found in desktop/moon.mod" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The full native test build compiles Proton's C sources, which include
      # CEF headers from the user-level store; `cef setup` assembles it.
      - name: Restore Proton runtime
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.proton.outputs.version }}

      - name: Assemble Proton CEF runtime
        run: >-
          moonx "moonbit-community/proton_cli@${{ steps.proton.outputs.version }}"
          cef setup

      # The sole Windows writer: main pushes populate the Windows cache key,
      # while PR jobs remain restore-only.
      - name: Save Proton runtime
        if: >-
          github.event_name == 'push' &&
          steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      # Full native test suite: the root module and every workspace member
      # (editor, desktop, inspect, protocol, workflow). Nothing here
      # initializes CEF or opens a window, so only the headers are needed.
      - name: Test native target
        run: moon test --target native

      # The cram suite is POSIX shell (`sh` heredocs, `sed`, `mktemp`); the
      # Linux job owns it. A Windows port would need PowerShell-flavored
      # blocks.
