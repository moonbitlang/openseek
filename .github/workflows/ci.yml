name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer PR head supersedes its older checks. Keep main runs complete so every
# merged commit still receives a full CI result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: bundled workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit package registry
        run: moon update

      # Standalone scripts resolve their own declared imports. Check all of them
      # without executing their main functions or setting up Desktop's runtime.
      - name: Check all bundled workflow scripts
        run: moon run scripts/check-workflows.mbtx

  sandbox-macos:
    name: sandbox (macOS, native)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Fail if sandbox enforcement disappears; guarded tests must not silently
      # turn this platform-specific regression job green without running.
      OPENSEEK_REQUIRE_SANDBOX_TESTS: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Test sandbox enforcement and oversized profiles
        run: moon test agent_tool/internal/sandbox --target native

      - name: Test reviewer printing and file reads
        run: moon test agent_tool/mbtx --target native --filter 'read-only snippets can print and read workspace source'

  check:
    name: check (${{ matrix.moonbit-channel }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Run stable targets independently (fail-fast: false), while the
      # native/JS/wasm split lets the three test suites run in parallel.
      fail-fast: false
      matrix:
        moonbit-channel: [stable]
        target: [native, js, wasm]
        include:
          - moonbit-channel: stable
            moonbit-version: latest
            deny-warn: "--deny-warn"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (${{ matrix.moonbit-channel }})
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit-version }}"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version
        run: |
          moon version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Check generated resource layout
        if: matrix.moonbit-channel == 'stable' && matrix.target == 'native'
        run: |
          moon run scripts/md_to_mbt_string -- --check prompt/default_prompt.mbt.md prompt/generated_default_prompt.mbt

      - name: Check formatting
        # Run the repository's one canonical formatter once on stable/native.
        # A second toolchain channel could require a different committed form.
        if: matrix.moonbit-channel == 'stable' && matrix.target == 'native'
        run: moon fmt --check

      - name: Check ${{ matrix.target }} target
        # This is the local-dependency integration check: desktop must compile
        # against the editor member from this checkout. Keeping the target
        # explicit also makes each matrix row own one complete check/test pair;
        # stable denies warnings across the complete integrated workspace.
        run: moon check --target ${{ matrix.target }} ${{ matrix.deny-warn }}

      - name: Check generated interfaces
        # Generated interfaces are toolchain-versioned, so compare them only
        # with the stable channel that owns the committed `.mbti`. This covers
        # the editor's public interfaces from the same checkout too. Ignore
        # blank-only formatter drift, but still reject content changes and new
        # `.mbti`.
        if: matrix.target == 'native'
        run: |
          moon info
          untracked_mbti="$(git ls-files --others --exclude-standard -- '*.mbti')"
          if [ -n "$untracked_mbti" ] ||
            ! git diff --quiet --ignore-blank-lines -- '*.mbti'; then
            git status --short -- '*.mbti'
            git diff --ignore-blank-lines -- '*.mbti'
            exit 1
          fi

      - name: Bundled workflows (offline child contract)
        if: matrix.target == 'native'
        run: moon run tests/integration/workflows

      - name: Test native target
        # The root workspace holds nothing of Proton: the window host is a
        # workspace of its own and is tested by the `desktop app` job, so
        # these rows need neither GTK nor the CEF runtime.
        if: matrix.target == 'native'
        run: moon test --target native

      - name: Test JS target
        # Run JS-only package tests from the same root workspace.
        if: matrix.target == 'js'
        run: moon test --target js

      - name: Test wasm target
        # The portability gate for every package carrying `+wasm` in its
        # `supported_targets`. Nothing here links native FFI, so what this row
        # proves is that the workspace's own portable logic behaves under
        # moonrun exactly as it does natively.
        if: matrix.target == 'wasm'
        run: moon test --target wasm

      - name: Cram (offline CLI docs)
        if: matrix.target == 'native'
        run: moon cram test tests/cram

      - name: Background turn lifecycle (offline CLI)
        if: matrix.target == 'native'
        run: |
          moon build . --target native
          moon run tests/integration/turn_finish.mbtx _build/native/debug/build/moonbitlang/openseek/openseek.exe

      # The backend with no window, built in this job because nothing here
      # set up a window toolkit: a Proton dependency reaching `desktop/backend`
      # or `desktop/server` fails this row. Then serve the console once.
      - name: Headless server (console gated by session)
        if: matrix.target == 'native'
        run: |
          moon build --target native desktop/server
          server=_build/native/debug/build/openseek_desktop/server/server.exe
          "$server" --resource-dir desktop --port 18741 > server.out 2> server.err &
          pid=$!
          for _ in $(seq 1 50); do
            grep -q '^http' server.out && break
            sleep 0.2
          done
          cat server.out server.err
          url="$(grep '^http' server.out)"
          # No session, no account route; the entry URL grants the session.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18741/v1/auth/me)" = 401
          curl -fsS -c cookies.txt -o /dev/null "$url"
          curl -fsS -b cookies.txt http://127.0.0.1:18741/v1/auth/me | grep -q '"login"'
          kill "$pid"

  # The Proton window host is a workspace of its own (`desktop/app/moon.work`),
  # so this is the one job here that sets up a window toolkit. Moon runs the
  # prebuild of every module a workspace resolves, and Proton's queries GTK and
  # X11 through pkg-config and reads the CEF runtime from its store.
  desktop-app:
    name: desktop app (Proton window host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit package registry
        run: moon update

      # Proton comes from the registry, so the version it is pinned to lives in
      # desktop/app/moon.mod and nowhere else. Read it back here rather than
      # repeating it, and reuse it for both the CEF cache key and the CLI.
      - name: Resolve pinned Proton version
        id: proton
        run: |
          version="$(sed -n 's/.*"moonbit-community\/proton@\([^"]*\)".*/\1/p' desktop/app/moon.mod)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pull requests may restore the default branch's cache, but their own
      # merge-ref caches are private to that PR and cannot warm other branches.
      - name: Restore Proton runtime
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: proton-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.proton.outputs.version }}

      # The shared libraries are on the runner image, but their pkg-config
      # metadata and headers come from the development packages.
      - name: Install Proton Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libx11-dev

      # `cef setup` installs the release-selected runtime and subprocess helper
      # into Proton's user-level immutable store. Setup is idempotent after a
      # cache hit.
      - name: Assemble Proton CEF runtime
        run: >-
          moonx "moonbit-community/proton_cli@${{ steps.proton.outputs.version }}"
          cef setup

      # This job is the sole Linux writer. PR jobs remain restore-only.
      - name: Save Proton runtime
        if: github.event_name == 'push' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.proton/store
            ~/.proton/helpers
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      # The workspace also holds everything the host depends on, which the
      # root jobs already cover, so every step names the host's own packages.
      - name: Check formatting
        working-directory: desktop/app
        run: moon fmt --check . internal/cdp internal/extension internal/shares

      - name: Check native target
        working-directory: desktop/app
        run: moon check --target native --deny-warn . internal/cdp internal/extension internal/shares

      - name: Check generated interfaces
        working-directory: desktop/app
        run: |
          moon info . internal/cdp internal/extension internal/shares
          untracked_mbti="$(git ls-files --others --exclude-standard -- '*.mbti')"
          if [ -n "$untracked_mbti" ] ||
            ! git diff --quiet --ignore-blank-lines -- '*.mbti'; then
            git status --short -- '*.mbti'
            git diff --ignore-blank-lines -- '*.mbti'
            exit 1
          fi

      - name: Test native target
        # No Xvfb: nothing here initializes CEF or opens a window; loading
        # libproton needs the libraries above, not a display.
        working-directory: desktop/app
        run: moon test --target native . internal/cdp internal/extension internal/shares

  # cmd/viz_app is a separate MoonBit module and owns its browser test runner.
  # Keep it out of Desktop's recipe so either application can be tested alone.
  viz-e2e:
    name: viz e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/viz_app/e2e/package-lock.json

      - name: Update MoonBit dependencies
        run: moon update

      - name: Install E2E dependencies
        working-directory: cmd/viz_app/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: cmd/viz_app/e2e
        run: npx playwright install --with-deps chromium

      - name: Build session viewer
        working-directory: cmd/viz_app
        run: moon build --target js

      - name: Run session viewer E2E tests
        working-directory: cmd/viz_app/e2e
        run: npm test

      # A published moonbitlang/inspect embeds the viewer (scripts/publish.mjs
      # inspect) so `moonx` can run it with no files beside the wasm. Build that
      # shape from this checkout and serve it from a directory outside it: the
      # shell and bundle must come from the binary, byte for byte, with the
      # --watch setting injected.
      - name: Serve inspect with the embedded viewer
        run: |
          bundle=_build/js/release/build/moonbitlang/openseek-viz-app/openseek-viz-app.js
          moon build --target js --release cmd/viz_app
          node scripts/embed_inspect_assets.mjs web/index.html "$bundle" inspect/generated_assets.mbt
          moon check --target wasm --deny-warn inspect
          moon build --target wasm --release inspect
          dir="$RUNNER_TEMP/inspect-smoke"
          mkdir -p "$dir"
          cp _build/wasm/release/build/moonbitlang/inspect/inspect.wasm "$dir/"
          (cd "$dir" && moonrun inspect.wasm -- --watch --host 127.0.0.1 --port 18731 > server.log 2>&1 &)
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null http://127.0.0.1:18731/ && break
            sleep 0.2
          done
          cat "$dir/server.log"
          grep -q 'shell from the copy built into this binary' "$dir/server.log"
          grep -q 'bundle from the copy built into this binary' "$dir/server.log"
          curl -fsS http://127.0.0.1:18731/ | grep -q 'window.__OPENSEEK_WATCH_MS__ = 1000;'
          curl -fsS http://127.0.0.1:18731/viz_app.js | cmp - "$bundle"
          pkill -f 'moonrun inspect.wasm' || true

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: viz-playwright-report
          path: |
            cmd/viz_app/e2e/playwright-report
            cmd/viz_app/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
