name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer PR head supersedes its older checks. Keep main runs complete so every
# merged commit still receives a full CI result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }}, ${{ matrix.moonbit-channel }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # Run both channels and targets independently (fail-fast: false): the
      # stable/nightly split identifies toolchain regressions, while the
      # native/JS split lets the two test suites run in parallel.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        moonbit-channel: [stable]
        target: [native, js]
        include:
          - moonbit-channel: stable
            moonbit-version: latest
            deny-warn: "--deny-warn"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout proton submodule
        run: |
          git submodule update --init ./desktop/lepus

      - name: Set up MoonBit (${{ matrix.moonbit-channel }})
        run: |
          case "${{ runner.os }}" in
            Linux|macOS)
              curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit-version }}"
              echo "$HOME/.moon/bin" >> $GITHUB_PATH
              ;;
            Windows)
              curl -fsSL https://cli.moonbitlang.com/install/install.ps1 | powershell -c -
              echo "$HOME/.moon/bin" >> $GITHUB_PATH
              ;;
          esac
        shell: bash

      - name: Show MoonBit version
        run: |
          moon version --all

      - name: Update MoonBit package registry
        run: moon update

      # OpenSeek, editor, editor-server, desktop, and Proton are tested together
      # by the root moon.work. The desktop and Proton native test binaries link
      # libproton.so, which on Linux hard-links libcef.so: without an assembled
      # CEF runtime the executables cannot even load. `cef setup` downloads the
      # pinned CEF distribution (cached below), builds libproton from the
      # submodule sources (needs pkg-config, GTK3 and X11 headers), and writes
      # desktop/lepus/.proton/runtime.json, which Proton's link config prefers
      # over the incomplete checked-in prebuilt.
      - name: Install Proton native build dependencies
        if: runner.os == 'Linux' && matrix.target == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libx11-dev xvfb

      # Pull requests may restore the default branch's cache, but their own
      # merge-ref caches are private to that PR and cannot warm other branches.
      - name: Restore CEF distribution
        if: runner.os == 'Linux' && matrix.target == 'native'
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          # Proton shares downloaded CEF distributions between projects here,
          # then copies the selected version into the project-local runtime.
          path: ~/.proton/cache/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/lepus/cli/cef/cef_platform.mbt') }}

      - name: Assemble Proton CEF runtime
        if: runner.os == 'Linux' && matrix.target == 'native'
        # Proton's link config discovers the assembled runtime by walking up
        # from the local proton module root. Run setup at that same project
        # root so it finds the submodule's checked-in prebuilt and writes the
        # runtime where the link config looks for it.
        run: |
          moon -C desktop/lepus install ./cli --bin target/proton-tools
          ./desktop/lepus/target/proton-tools/proton_cli -C "$PWD/desktop/lepus" cef setup
          test -f desktop/lepus/.proton/runtime.json
          # `cef setup` stages the checked-in linux prebuilt libproton.so into
          # the runtime dist, but that prebuilt predates the menu, notification
          # and directory-dialog APIs (darwin's was rebuilt, linux's was not),
          # so the full desktop app fails to link. Rebuild libproton from the
          # submodule sources against the downloaded CEF — the same build the
          # AppImage packager runs — and replace the staged library.
          dist=$(jq -r .dist desktop/lepus/.proton/runtime.json)
          case "$dist" in
            /*) ;;
            *) dist="$PWD/desktop/lepus/$dist" ;;
          esac
          # The active manifest owns this absolute path: Proton may use its
          # shared user cache or a PROTON_CEF_CACHE override.
          cef_root=$(jq -r .cef desktop/lepus/.proton/runtime.json)
          cmake -S desktop/lepus/native -B desktop/target/proton-native/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DPROTON_WITH_ENGINE=ON -DPROTON_ENGINE_ROOT="$cef_root"
          cmake --build desktop/target/proton-native/build --config Release
          cp desktop/target/proton-native/build/lib/libproton.so "$dist/lib/libproton.so"
          nm -D "$dist/lib/libproton.so" | grep -q proton_runtime_set_menu_json

      # The stable/native main job is the sole Linux writer. PR jobs remain
      # restore-only, and nightly does not race stable to reserve the same key.
      - name: Save CEF distribution
        if: >-
          github.event_name == 'push' &&
          runner.os == 'Linux' &&
          matrix.moonbit-channel == 'stable' &&
          matrix.target == 'native' &&
          steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.proton/cache/cef
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      - name: Check formatting
        # Stable only, for the same reason as `--deny-warn` below. `moon fmt` is
        # a moving target on nightly: its output for markdown `mbt` blocks
        # changed between 2026-07-15 and 2026-07-25, which red-lined this step
        # for a file no one had touched. And because the step ran on both
        # channels, the repo could only ever satisfy it while the two
        # formatters agreed — once they disagree there is no committed form
        # that passes, which is not a state CI should be able to reach.
        if: matrix.moonbit-channel == 'stable' && matrix.target == 'native'
        run: moon fmt --check

      - name: Check ${{ matrix.target }} target
        # This is the local-dependency integration check: desktop must compile
        # against the editor member from this checkout. Keeping the target
        # explicit also makes each matrix row own one complete check/test pair;
        # stable denies warnings across the complete integrated workspace.
        run: moon check --target ${{ matrix.target }} ${{ matrix.deny-warn }}

      - name: Check generated interfaces
        # `moon info` formats abstract types differently across toolchain
        # versions (`type X` on nightly vs `pub struct X { // private fields }`
        # on stable), and the committed `.mbti` are nightly-generated — so this
        # consistency check is only meaningful on nightly. This covers the
        # editor's public interfaces from the same checkout too. Ignore
        # blank-only formatter drift, but still reject content changes and new
        # `.mbti`.
        if: matrix.target == 'native'
        run: |
          moon info
          untracked_mbti="$(git ls-files --others --exclude-standard -- '*.mbti')"
          if [ -n "$untracked_mbti" ] ||
            ! git diff --quiet --ignore-blank-lines -- '*.mbti'; then
            git status --short -- '*.mbti'
            git diff --ignore-blank-lines -- '*.mbti'
            exit 1
          fi
        shell: bash

      - name: Test native target
        # xvfb: the desktop/Proton windowed tests create real CEF windows (the
        # Linux engine is compiled with CEF_X11), and the runner is headless.
        # Windows and macOS runners do not have CEF for the desktop tests.
        if: matrix.target == 'native'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a moon test --target native
          else
            moon test --target native
          fi
        shell: bash

      - name: Test JS target
        # Run JS-only package tests from the same root workspace. These do not
        # create Proton windows and therefore do not need Xvfb.
        if: matrix.target == 'js'
        run: moon test --target js

      - name: Cram (offline CLI docs)
        if: runner.os == 'Linux' && matrix.target == 'native'
        run: moon cram test tests/cram