name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.moonbit-channel }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Temporarily disabled until `<?` is available on stable/latest.
          # - moonbit-channel: stable
          #   moonbit-version: latest
          - moonbit-channel: nightly
            moonbit-version: nightly
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (${{ matrix.moonbit-channel }})
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit-version }}"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version
        run: |
          moon version --all

      - name: Seed MoonBit registry index
        run: |
          mkdir -p "$HOME/.moon/registry"
          for attempt in 1 2 3; do
            rm -rf "$HOME/.moon/registry/index"
            if git \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=60 \
              clone --depth 1 https://mooncakes.io/git/index "$HOME/.moon/registry/index"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Check formatting
        run: moon fmt --check

      - name: Check (deny warnings)
        run: moon check --deny-warn

      - name: Test
        run: moon test

      - name: Cram (offline CLI docs)
        run: moon cram test tests/cram

  desktop-appimage:
    name: desktop appimage (linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The lepus submodule is a private repo, so the default workflow token
      # cannot clone it. LEPUS_READ_TOKEN is a fine-grained PAT with read-only
      # access to moonbit-community/lepus. Note: this secret is unavailable to
      # pull requests from forks, where this job will fail at this step.
      - name: Check out the lepus submodule
        env:
          LEPUS_READ_TOKEN: ${{ secrets.LEPUS_READ_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${LEPUS_READ_TOKEN}@github.com/".insteadOf \
            "git@github.com:"
          git submodule update --init --recursive

      - name: Set up MoonBit (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version
        run: |
          moon version --all

      - name: Seed MoonBit registry index
        run: |
          mkdir -p "$HOME/.moon/registry"
          for attempt in 1 2 3; do
            rm -rf "$HOME/.moon/registry/index"
            if git \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=60 \
              clone --depth 1 https://mooncakes.io/git/index "$HOME/.moon/registry/index"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install GTK and WebKitGTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the AppImage
        run: moon run --target native ./desktop/package_linux.mbtx

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSeek-Desktop-linux-x86_64
          path: desktop/dist/OpenSeek-Desktop-linux-x86_64.AppImage
          if-no-files-found: error

  desktop-macos:
    name: desktop app (macos, unsigned)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The lepus submodule is a private repo, so the default workflow token
      # cannot clone it. LEPUS_READ_TOKEN is a fine-grained PAT with read-only
      # access to moonbit-community/lepus. Note: this secret is unavailable to
      # pull requests from forks, where this job will fail at this step.
      - name: Check out the lepus submodule
        env:
          LEPUS_READ_TOKEN: ${{ secrets.LEPUS_READ_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${LEPUS_READ_TOKEN}@github.com/".insteadOf \
            "git@github.com:"
          git submodule update --init --recursive

      - name: Set up MoonBit (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version
        run: |
          moon version --all

      - name: Seed MoonBit registry index
        run: |
          mkdir -p "$HOME/.moon/registry"
          for attempt in 1 2 3; do
            rm -rf "$HOME/.moon/registry/index"
            if git \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=60 \
              clone --depth 1 https://mooncakes.io/git/index "$HOME/.moon/registry/index"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      # No MACOS_SIGN_IDENTITY in the environment, so the bundle is ad-hoc
      # signed: fine for debugging, but downloads are quarantined by
      # Gatekeeper on other machines — clear it before launching:
      #   xattr -dr com.apple.quarantine "OpenSeek Desktop.app"
      - name: Build the app bundle
        run: moon run --target native ./desktop/package_macos.mbtx

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSeek-Desktop-macos-arm64
          path: desktop/dist/OpenSeek Desktop-macos-arm64.zip
          if-no-files-found: error
