name: Sandbox

# macOS minutes cost ten times Linux minutes, and this job only tests the
# root module's sandbox and mbtx packages. Pull requests that change only the
# other applications in this repository cannot affect them and skip it. Any
# other path, including a new directory, still runs it; so does every push to
# main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**"
      - "!desktop/**"
      - "desktop/.moonbit-version"
      - "!editor/**"
      - "!openseek_tui/**"
      - "!cmd/**"
      - "!inspect/**"
      - "!tools_sdk/**"
      - "!android/**"
      - "!docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox-macos:
    name: sandbox (macOS, native)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Fail if sandbox enforcement disappears; guarded tests must not silently
      # turn this platform-specific regression job green without running.
      OPENSEEK_REQUIRE_SANDBOX_TESTS: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          version="$(cat "$GITHUB_WORKSPACE/desktop/.moonbit-version")"
          test -n "$version"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Test sandbox enforcement and oversized profiles
        run: moon test agent_tool/internal/sandbox --target native

      - name: Test reviewer printing and file reads
        run: moon test agent_tool/mbtx --target native --filter 'read-only snippets can print and read workspace source'
