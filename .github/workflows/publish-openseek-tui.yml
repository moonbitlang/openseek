name: publish-openseek-tui

# openseek_tui is versioned in lockstep with the root module: openseek_tui@X
# imports and runs openseek@X (see openseek_tui/README.md). Dispatch this after
# publish-openseek for the same release: the staged package compiles against
# the registry's moonbitlang/openseek and openseek_protocol.
on:
  workflow_dispatch:

concurrency:
  group: publish-openseek-tui
  cancel-in-progress: false

jobs:
  publish-openseek-tui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install moon
        run: |
          version="$(cat "$GITHUB_WORKSPACE/desktop/.moonbit-version")"
          test -n "$version"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$version"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: update MoonBit dependencies
        run: moon update

      # Build exactly what would be published, on its own against the registry,
      # before anything is uploaded.
      - name: prepublish check
        run: |
          staged="$RUNNER_TEMP/openseek_tui"
          node scripts/publish.mjs openseek_tui --stage-only "$staged"
          cd "$staged"
          export MOON_WORK=off
          moon update
          moon check --target native --deny-warn
          moon test --target native
          moon cram test tests/cram

      - name: publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBITLANG_TOKEN secret is not set."
            exit 1
          fi
          trap 'rm -f ~/.moon/credentials.json' EXIT
          umask 077
          printf '%s\n' "$SECRET" > ~/.moon/credentials.json
          moon version --all
          node scripts/publish.mjs openseek_tui
