<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parallel speedup</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: light-dark(#1f2937, #e5e7eb); background: transparent; }
    .answer { max-width: 48rem; padding: 1rem; }
    h2 { margin: 0 0 1rem; font-size: 1.15rem; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,15rem),1fr)); gap: 1rem; }
    label { display: block; }
    input { width: 100%; margin: .5rem 0; accent-color: #6366f1; }
    output { display: block; margin: 1rem 0; font-size: 2rem; font-weight: 650; }
    .composition { display: flex; height: 1.25rem; overflow: hidden; border-radius: .3rem; }
    .serial { background: #d97706; }
    .parallel { background: #6366f1; }
    .legend { font-size: .9rem; }
    button { padding: .35rem .8rem; color: inherit; background: transparent; border: 1px solid light-dark(#9ca3af,#6b7280); border-radius: .35rem; cursor: pointer; }
    :focus-visible { outline: 2px solid #6366f1; outline-offset: 3px; }
/* MoonPlot 0.18.0 moonplot.css, Apache-2.0.
   https://github.com/moonbit-community/moonplot */
/* Optional component styles. All rules are scoped to MoonPlot nodes. */
.moonplot {
  --moonplot-text: #263443;
  --moonplot-muted: #64748b;
  --moonplot-border: #e5e9ed;
  --moonplot-accent: #286b73;
  --moonplot-tooltip-background: #fff;
  color: var(--moonplot-text);
  font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.moonplot .moonplot-viewport { position: relative; }
.moonplot .moonplot-tooltip {
  position: absolute;
  top: 12px;
  right: 16px;
  z-index: 1;
  display: flex;
  gap: 20px;
  padding: 9px 14px;
  border: 1px solid var(--moonplot-border);
  border-radius: 8px;
  max-width: calc(100% - 32px);
  box-sizing: border-box;
  overflow-wrap: anywhere;
  background: var(--moonplot-tooltip-background);
  box-shadow: 0 3px 12px #2634430d;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.moonplot .moonplot-tooltip-content { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.moonplot .moonplot-tooltip-series { font-size: 12px; font-weight: 600; }
.moonplot .moonplot-tooltip-values { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.moonplot .moonplot-coordinate { display: flex; align-items: baseline; gap: 8px; }
.moonplot .moonplot-coordinate-label { color: var(--moonplot-muted); font-size: 12px; }
.moonplot .moonplot-coordinate b { font-weight: 600; }
.moonplot .moonplot-legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 0; }
.moonplot .moonplot-series {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 6px 11px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--moonplot-text);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background-color 120ms, border-color 120ms;
}
.moonplot .moonplot-series:hover { background: #f4f6f8; border-color: var(--moonplot-border); }
.moonplot .moonplot-series:focus-visible { outline: 2px solid var(--moonplot-accent); outline-offset: 2px; }
.moonplot .moonplot-series[aria-pressed="false"] { color: var(--moonplot-muted); }
.moonplot .moonplot-series[aria-pressed="false"] .moonplot-swatch { opacity: .4; filter: grayscale(1); }
.moonplot .moonplot-series[aria-pressed="false"] span:last-child { text-decoration: line-through; }
.moonplot .moonplot-swatch { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; }
@media (pointer: coarse) { .moonplot .moonplot-series { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) { .moonplot .moonplot-series { transition: none; } }


  </style>
</head>
<body>
  <div id="app"></div>
  <!-- openseek:script -->
</body>
</html>
