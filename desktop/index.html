<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSeek Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- The embedded code viewer's styles, assembled from the editor submodule
         by the packager (see build_viewer_stylesheet). -->
    <link rel="stylesheet" href="viewer.css" />
    <style>
      /* openseek — calm, minimal, all-mono coding agent.
         Light mode primary, warm paper surfaces, hairline borders, blue accent. */
      :root {
        color-scheme: light dark;

        --mono: "Geist Mono", "SF Mono", ui-monospace, "Cascadia Mono", Menlo,
          Consolas, monospace;

        --paper: #fbfbf9;
        --surface: #ffffff;
        --surface-2: #f6f6f3;
        --ink: #16171a;
        --ink-2: #5c5f66;
        --ink-3: #9a9da4;
        --line: #e9e8e3;
        --line-2: #f0efea;

        --accent: #3b6ef5;
        --accent-ink: #2a55cc;
        --accent-soft: #eef2fe;
        --accent-line: #d6e0fd;

        --add: #1f8a5b;
        --add-bg: #eaf6ef;
        --add-line: #cdead9;
        --del: #c0453b;
        --del-bg: #fcefed;
        --del-line: #f2d4cf;
        --warn: #b7791f;
        --tool: #7a5af0;
        --tool-bg: #f1eefe;
        --tool-line: #e6e0fb;

        --code: #2b2f36;

        --radius: 9px;
        --radius-sm: 6px;
        --radius-lg: 14px;
        --shadow: 0 1px 2px rgba(20, 23, 26, 0.04),
          0 6px 22px -10px rgba(20, 23, 26, 0.1);
        --shadow-pop: 0 8px 30px -8px rgba(20, 23, 26, 0.22);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #16181d;
          --surface: #1c1f26;
          --surface-2: #23272f;
          --ink: #e9ebf0;
          --ink-2: #a3a8b4;
          --ink-3: #6f7480;
          --line: #2c313b;
          --line-2: #262b33;

          --accent: #5b8cff;
          --accent-ink: #9db8ff;
          --accent-soft: #1e2740;
          --accent-line: #2f3e63;

          --add: #3fd089;
          --add-bg: #16271f;
          --add-line: #244534;
          --del: #ff8a80;
          --del-bg: #2a1b1b;
          --del-line: #4a2f2f;
          --warn: #e3b341;
          --tool: #b39bff;
          --tool-bg: #221f33;
          --tool-line: #322c4a;

          --code: #d7dbe2;

          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3),
            0 6px 22px -10px rgba(0, 0, 0, 0.5);
          --shadow-pop: 0 8px 30px -8px rgba(0, 0, 0, 0.6);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        /* The app shell never scrolls as a whole; scrolling is delegated to
           the inner panes. Without this, any sub-pixel overflow bubbles to the
           body and shows redundant window-level scrollbars. */
        overflow: hidden;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.55;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      ::selection {
        background: var(--accent-soft);
      }

      /* quiet scrollbars */
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--ink) 14%, transparent);
        border-radius: 99px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: color-mix(in srgb, var(--ink) 26%, transparent);
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      @keyframes pulseDot {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent);
        }
        70% {
          box-shadow: 0 0 0 6px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .app {
        display: grid;
        grid-template-columns: minmax(220px, 264px) minmax(0, 1fr);
        /* Track #app's content box (which already accounts for any scrollbar)
           rather than 100vh, so the two height bases can't disagree. */
        height: 100%;
        min-height: 0;
      }

      /* Collapsed: the sidebar column folds to zero and the conversation
         takes the full width. The aside stays in the DOM (merely unmounted
         from layout) so reopening keeps its scroll position. */
      .app.sidebar-collapsed {
        grid-template-columns: minmax(0, 1fr);
      }
      .app.sidebar-collapsed > aside {
        display: none;
      }

      /* The conversation (left) and the editor (right) live side by side as two
         independent parts. The editor track is zero-width until the panel
         opens, so the viewer host element stays in the DOM but takes no
         space. */
      .content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 0;
        min-width: 0;
        min-height: 0;
      }

      /* Open: the conversation and the editor share the content area. The
         editor needs room for both the viewer and the 232px tree column, so it
         floors at 460px rather than collapsing the viewer. */
      .content.panel-open {
        grid-template-columns: minmax(0, 1fr) minmax(460px, 1fr);
      }

      /* ---------- files panel ---------- */
      .topbar-toggle {
        margin-left: auto;
        padding: 4px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink-2);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button.topbar-toggle:not(:disabled):hover {
        background: var(--surface-2);
      }

      .topbar-toggle.active {
        background: var(--accent-soft);
        color: var(--accent-ink);
        border-color: var(--accent-line);
      }

      /* The editor part: viewer (left) beside the file-tree column (right). */
      .editor {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 232px;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border-left: 1px solid var(--line);
        background: var(--surface);
        /* Own stacking context so the opaque editor always paints above the
           conversation column, never the other way around. */
        position: relative;
        z-index: 1;
      }

      .file-tree-column {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border-left: 1px solid var(--line);
        background: var(--surface);
      }

      .file-filter {
        flex: 0 0 auto;
        width: auto;
        margin: 8px;
        padding: 6px 9px;
        font-size: 12px;
      }

      .file-panel-error {
        flex: 0 0 auto;
        padding: 8px 12px;
        font-size: 12px;
        color: var(--danger, #c0392b);
        background: var(--surface-2);
      }

      .file-tree {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 4px 0 8px;
      }

      .file-panel-empty {
        padding: 12px;
        font-size: 12px;
        color: var(--ink-2);
      }

      .tree-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-top: 3px;
        padding-bottom: 3px;
        padding-right: 10px;
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tree-row:hover {
        background: var(--surface-2);
      }

      .tree-row.selected {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }

      .tree-chevron {
        flex: 0 0 auto;
        width: 12px;
        color: var(--ink-2);
        font-size: 10px;
      }

      .tree-dir .tree-name {
        font-weight: 600;
      }

      .tree-name {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .viewer-host {
        /* The embedded viewer positions its layers absolutely; without a
           positioning context here they escape and paint over the chat. It is
           the first cell of the `.editor` grid (the `minmax(0, 1fr)` track). */
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      /* ---------- sidebar ---------- */
      aside {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 14px;
        min-width: 0;
        min-height: 0;
        padding: 14px 12px;
        border-right: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-2);
      }

      .sidebar-main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        align-content: start;
        gap: 18px;
        min-width: 0;
        min-height: 0;
      }

      .sidebar-section.sessions {
        overflow-y: auto;
        overflow-x: hidden;
        min-height: 0;
        align-content: start;
      }

      .sidebar-section {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .sidebar-heading {
        padding: 0 8px;
        margin-bottom: 4px;
        color: var(--ink-3);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        line-height: 20px;
      }

      .conversation-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        min-width: 0;
        min-height: 32px;
        padding: 0 8px;
        border-radius: var(--radius-sm);
        color: var(--ink-2);
        font-size: 12.5px;
      }

      .conversation-row:hover {
        background: var(--surface-2);
      }

      .conversation-row.active {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }

      button.conversation-row {
        width: 100%;
        border: 0;
        background: transparent;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      button.conversation-row:disabled {
        cursor: default;
      }

      button.conversation-row.active {
        background: var(--accent-soft);
      }

      .conversation-row.error {
        color: var(--del);
      }

      .conversation-row.running {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .sidebar-icon {
        display: grid;
        place-items: center;
        width: 20px;
        color: var(--accent);
        font-size: 14px;
        line-height: 1;
      }

      .sidebar-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-footer {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .sidebar-button {
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
        min-height: 34px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--ink-2);
        padding: 0 8px;
        text-align: left;
        cursor: pointer;
      }

      .sidebar-button .sidebar-icon {
        color: var(--ink-3);
      }

      .sidebar-button.active {
        background: var(--surface-2);
        color: var(--ink);
      }

      button.sidebar-button:not(:disabled):hover {
        background: var(--surface-2);
        color: var(--ink);
      }

      /* ---------- main column ---------- */
      main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        /* Constrain the single column too: without this it defaults to `auto`
           and sizes to its widest content (a long code line), so the
           transcript would grow past `main`'s track and slide under the files
           panel. minmax(0, …) holds it to the track and lets inner content
           wrap/scroll instead. */
        grid-template-columns: minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--paper);
      }

      /* ---------- top bar ---------- */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 46px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .topbar-toggle {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-left: -4px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--ink-3);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      .topbar-toggle:hover {
        background: var(--surface-2);
        color: var(--ink);
      }

      .topbar-icon {
        color: var(--accent);
        font-size: 14px;
        line-height: 1;
      }

      .topbar-title {
        min-width: 0;
        max-width: 52%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12.5px;
        color: var(--ink);
      }

      .topbar-branch {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .topbar-branch::before {
        content: "⎇";
        font-size: 12px;
      }

      .run-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-left: auto;
        font-size: 11.5px;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .run-status.accent .run-text {
        color: var(--accent-ink);
      }

      .run-text {
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Topbar app launcher: a button at the far right opening a dropdown of
         installed apps that open the active workspace. */
      .launcher {
        position: relative;
        flex: 0 0 auto;
      }
      .launcher-button {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 28px;
        padding: 0 7px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink-3);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }
      .launcher-button:hover,
      .launcher-button.open {
        background: var(--surface-2);
        color: var(--ink);
      }
      .launcher-button:disabled {
        opacity: 0.4;
        cursor: default;
        background: transparent;
        color: var(--ink-3);
      }
      .launcher-caret {
        font-size: 9px;
      }
      .launcher-backdrop {
        position: fixed;
        inset: 0;
        z-index: 30;
      }
      .launcher-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        min-width: 220px;
        max-height: min(70vh, 460px);
        overflow-y: auto;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-pop);
        z-index: 31;
      }
      .launcher-item {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 7px 9px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--ink);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .launcher-item:hover {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .launcher-icon {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        object-fit: contain;
      }
      .launcher-icon.letter {
        display: grid;
        place-items: center;
        background: var(--surface-2);
        color: var(--ink-3);
        font-size: 12px;
        font-weight: 600;
      }
      .launcher-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .launcher-empty {
        padding: 9px 10px;
        color: var(--ink-3);
        font-size: 12.5px;
      }
      .launcher-empty.danger {
        color: var(--del);
      }

      .run-dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--ink-3);
        flex: 0 0 auto;
      }
      .run-dot.ok {
        background: var(--add);
      }
      .run-dot.warn {
        background: var(--warn);
      }
      .run-dot.danger {
        background: var(--del);
      }
      .run-dot.accent {
        background: var(--accent);
      }
      .run-dot.pulse {
        animation: pulseDot 1.6s ease-out infinite;
      }

      /* ---------- transcript ---------- */
      .transcript {
        min-height: 0;
        overflow: auto;
        padding: 24px 24px 22px;
        background: transparent;
      }

      .stream {
        display: grid;
        /* A bare `auto` column takes its minimum from content, so one wide
           <pre> or long token would blow the track past max-width and shove
           the message off the right. minmax(0, …) lets it shrink so the
           pre's own `overflow: auto` scrolls and plain text wraps instead. */
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        max-width: 820px;
        margin: 0 auto;
      }

      /* empty state */
      .empty {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 14px;
        min-height: 46vh;
        text-align: center;
        padding: 32px 12px;
      }
      .empty-badge {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: var(--radius-lg);
        background: var(--accent-soft);
        border: 1px solid var(--accent-line);
        color: var(--accent);
        font-size: 24px;
        line-height: 1;
      }
      .empty-title {
        font-size: 16px;
        color: var(--ink);
      }
      .empty-sub {
        max-width: 400px;
        color: var(--ink-3);
        font-size: 12.5px;
        line-height: 1.6;
      }

      /* messages */
      .msg {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        min-width: 0;
        animation: riseIn 0.34s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        border-radius: 7px;
        font-size: 14px;
        line-height: 1;
      }
      .avatar.user {
        background: var(--surface-2);
        border: 1px solid var(--line);
        color: var(--ink-2);
      }
      .avatar.agent {
        background: var(--accent-soft);
        border: 1px solid var(--accent-line);
        color: var(--accent);
      }

      .msg-body {
        flex: 1;
        min-width: 0;
        padding-top: 2px;
      }

      .msg-role {
        margin-bottom: 5px;
        color: var(--ink-3);
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .msg-content {
        /* Let the content box shrink so a wide child (a <pre>) scrolls
           internally rather than widening the message. */
        min-width: 0;
        color: var(--ink);
        font-size: 13.5px;
        line-height: 1.62;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .msg-content.danger {
        border-left: 2px solid var(--del);
        border-radius: 4px;
        background: var(--del-bg);
        padding: 8px 12px;
      }

      .msg-content.reasoning {
        border-left: 2px solid var(--line-2);
        padding-left: 10px;
        color: var(--ink-3);
        font-size: 12.5px;
      }

      /* markdown-rendered assistant content: block elements own the spacing,
         so the pre-wrap used for plain text would double every newline */
      .msg-content.markdown {
        white-space: normal;
      }
      .msg-content.markdown > :first-child {
        margin-top: 0;
      }
      .msg-content.markdown > :last-child {
        margin-bottom: 0;
      }
      .msg-content.markdown p {
        margin: 0.55em 0;
      }
      .msg-content.markdown h1,
      .msg-content.markdown h2,
      .msg-content.markdown h3,
      .msg-content.markdown h4,
      .msg-content.markdown h5,
      .msg-content.markdown h6 {
        margin: 0.95em 0 0.45em;
        line-height: 1.35;
        font-weight: 600;
      }
      .msg-content.markdown h1 {
        font-size: 1.3em;
      }
      .msg-content.markdown h2 {
        font-size: 1.18em;
      }
      .msg-content.markdown h3 {
        font-size: 1.08em;
      }
      .msg-content.markdown h4,
      .msg-content.markdown h5,
      .msg-content.markdown h6 {
        font-size: 1em;
      }
      .msg-content.markdown ul,
      .msg-content.markdown ol {
        margin: 0.45em 0;
        padding-left: 1.5em;
      }
      .msg-content.markdown li {
        margin: 0.2em 0;
      }
      .msg-content.markdown ul.tight p,
      .msg-content.markdown ol.tight p {
        margin: 0;
      }
      .msg-content.markdown pre {
        margin: 0.55em 0;
        padding: 10px 13px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--code);
        font-size: 12px;
        line-height: 1.55;
        white-space: pre;
      }
      .msg-content.markdown pre code {
        padding: 0;
        border: none;
        background: none;
        font-size: inherit;
      }
      /* Plain-text fallback when the markdown parser rejects an input. */
      .msg-content.markdown pre.markdown-fallback {
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        font: inherit;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .msg-content.markdown pre.raw-html {
        color: var(--ink-3);
        white-space: pre-wrap;
      }
      .msg-content.markdown blockquote {
        margin: 0.55em 0;
        padding: 2px 12px;
        border-left: 3px solid var(--line-2);
        color: var(--ink-2);
      }
      .msg-content.markdown table {
        /* Scroll a wide table horizontally inside the message (like a code
           block) rather than letting it widen or get clipped: display:block +
           max-content lets overflow-x engage while max-width keeps it in
           column. */
        display: block;
        width: max-content;
        max-width: 100%;
        overflow-x: auto;
        margin: 0.55em 0;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      .msg-content.markdown th,
      .msg-content.markdown td {
        padding: 4px 10px;
        border: 1px solid var(--line);
      }
      .msg-content.markdown th {
        background: var(--surface-2);
        font-weight: 600;
      }
      .msg-content.markdown hr {
        margin: 0.9em 0;
        border: none;
        border-top: 1px solid var(--line);
      }
      .msg-content.markdown a {
        color: var(--accent);
      }
      .msg-content.markdown img {
        max-width: 100%;
      }
      .msg-content.markdown .footnote {
        margin: 0.45em 0;
        color: var(--ink-3);
        font-size: 12px;
      }
      .msg-content.markdown .footnote-label {
        margin-right: 6px;
        color: var(--ink-2);
      }

      /* live streaming bubble: a blinking caret after the latest text */
      .msg.streaming .msg-content::after {
        content: "▍";
        margin-left: 2px;
        color: var(--accent);
        animation: caretBlink 1s steps(1) infinite;
      }

      @keyframes caretBlink {
        50% {
          opacity: 0;
        }
      }


      .inline-code {
        border-radius: 4px;
        background: var(--surface-2);
        color: var(--accent-ink);
        border: 1px solid var(--line-2);
        padding: 0.08em 0.34em;
        font-size: 0.92em;
        overflow-wrap: anywhere;
      }

      /* A clickable file reference in transcript text. It is a <button> (the
         only inline element that carries a click here), stripped of button
         chrome so it reads as a link, or as accented inline code when it wraps
         a code span. */
      .file-link {
        display: inline;
        margin: 0;
        padding: 0;
        border: none;
        background: none;
        font: inherit;
        text-align: left;
        color: var(--accent);
        cursor: pointer;
        vertical-align: baseline;
      }
      .file-link:hover,
      .file-link:focus-visible {
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .file-link .inline-code {
        color: var(--accent);
        border-color: var(--accent);
        text-decoration: none;
      }
      .file-link:hover .inline-code,
      .file-link:focus-visible .inline-code {
        background: var(--accent);
        color: var(--bg, #fff);
      }

      /* tool / step output, indented under the agent avatar */
      .tool-row {
        padding-left: 38px;
        min-width: 0;
        animation: riseIn 0.34s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .tool-card {
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        overflow: hidden;
      }
      .tool-card.error {
        border-color: var(--del-line);
      }

      .tool-head {
        padding: 7px 12px;
        border-bottom: 1px solid var(--line-2);
        background: var(--surface-2);
        color: var(--ink-2);
        font-size: 10.5px;
        letter-spacing: 0.04em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tool-card.error .tool-head {
        color: var(--del);
        background: var(--del-bg);
        border-bottom-color: var(--del-line);
      }

      .tool-card pre {
        max-height: 260px;
        margin: 0;
        padding: 11px 13px;
        overflow: auto;
        color: var(--code);
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      /* ---------- composer ---------- */
      .composer {
        border-top: 1px solid var(--line);
        background: var(--paper);
        padding: 16px 24px 18px;
      }

      .composer-inner {
        position: relative;
        display: grid;
        gap: 8px;
        max-width: 820px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 8px 10px;
        box-shadow: var(--shadow);
      }

      /* slash/skill completion menu, floated above the composer */
      .completion-menu {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(100% + 8px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-pop);
        overflow: hidden;
        z-index: 20;
      }
      .completion-hint {
        padding: 6px 12px;
        border-bottom: 1px solid var(--line-2);
        color: var(--ink-3);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .completion-list {
        max-height: 240px;
        overflow-y: auto;
        padding: 4px;
      }
      .completion-item {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .completion-item.selected {
        background: var(--accent-soft);
      }
      .completion-label {
        flex: none;
        color: var(--ink);
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .completion-item.selected .completion-label {
        color: var(--accent-ink);
      }
      .completion-detail {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink-3);
        font-size: 12px;
      }

      /* transient notice docked above the composer (e.g. compaction) */
      .composer-notice {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 820px;
        margin: 0 auto 8px;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
        color: var(--ink-2);
        font-size: 12.5px;
      }
      .composer-notice-icon {
        flex: none;
      }
      .composer-notice-text {
        animation: caretBlink 1.4s steps(1) infinite;
      }

      /* steering input not yet folded into the running turn: a panel docked
         above the composer until the engine settles it */
      .pending-steers {
        max-width: 820px;
        margin: 0 auto 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
        padding: 4px 10px;
      }
      .pending-steer-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 4px 0;
        color: var(--ink-2);
        font-size: 12.5px;
        line-height: 1.5;
      }
      .pending-steer-row + .pending-steer-row {
        border-top: 1px solid var(--line-2);
      }
      .pending-steer-icon {
        color: var(--accent);
        flex: none;
      }
      .pending-steer-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pending-steer-state {
        flex: none;
        color: var(--ink-3);
        font-size: 11px;
        animation: caretBlink 1.4s steps(1) infinite;
      }

      .composer textarea {
        min-height: 26px;
        max-height: 180px;
        border: 0;
        background: transparent;
        padding: 6px 6px 2px;
        resize: none;
        color: var(--ink);
        font-size: 13.5px;
        line-height: 1.6;
      }
      .composer textarea:focus {
        outline: 0;
      }
      .composer textarea::placeholder {
        color: var(--ink-3);
      }

      .composer-toolbar {
        display: flex;
        align-items: center;
        padding-top: 8px;
        border-top: 1px solid var(--line-2);
      }

      .composer-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-width: 0;
      }

      .composer-model {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 260px;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 4px 9px;
        color: var(--ink-2);
        font-size: 11.5px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .composer-model::before {
        content: "✦";
        color: var(--accent);
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 30px;
        min-width: 30px;
        height: 30px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--ink-2);
        padding: 0;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      .icon-button:not(:disabled):hover {
        background: var(--surface-2);
      }

      .send-button {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }
      .send-button:not(:disabled):hover {
        background: var(--accent-ink);
      }
      .send-button:disabled {
        background: var(--surface-2);
        color: var(--ink-3);
      }

      .stop-button {
        border-color: var(--del-line);
        background: var(--del-bg);
        color: var(--del);
        font-size: 13px;
      }
      .stop-button:not(:disabled):hover {
        background: color-mix(in srgb, var(--del-bg) 78%, var(--del));
      }

      /* ---------- generic buttons ---------- */
      button {
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      button.secondary {
        border-color: var(--line);
        background: var(--surface);
        color: var(--ink);
        padding: 6px 12px;
        font-size: 12px;
      }
      button.secondary:not(:disabled):hover {
        background: var(--surface-2);
      }

      #saveApiKey {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
        padding: 8px 14px;
        font-size: 12.5px;
      }
      #saveApiKey:not(:disabled):hover {
        background: var(--accent-ink);
        border-color: var(--accent-ink);
      }

      /* ---------- settings popup ---------- */
      .setup-backdrop {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
        background: color-mix(in srgb, var(--ink) 22%, transparent);
        backdrop-filter: blur(3px);
      }

      .setup-popup {
        display: grid;
        gap: 18px;
        width: min(520px, 100%);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface);
        padding: 20px;
        box-shadow: var(--shadow-pop);
      }

      .setup-header {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
      }

      .setup-title {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      h1,
      h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.3;
      }

      .status {
        color: var(--ink-3);
        font-size: 12px;
      }

      .settings {
        display: grid;
        align-content: start;
        gap: 14px;
      }

      .setting-hint {
        margin-top: -8px;
        color: var(--ink-3);
        font-size: 11.5px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--ink-3);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      input,
      textarea,
      select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface-2);
        color: var(--ink);
        padding: 9px 10px;
        font-size: 13px;
        letter-spacing: -0.01em;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* ---------- skills page ---------- */
      .skills-page {
        grid-row: 1 / -1;
        min-height: 0;
        overflow: auto;
        padding: 40px 28px 28px;
      }

      .skills-page-inner {
        display: grid;
        align-content: start;
        gap: 12px;
        max-width: 720px;
        margin: 0 auto;
      }

      .skills-header {
        display: grid;
        gap: 6px;
        margin-bottom: 6px;
      }

      .skills-header h1 {
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      .skills-subtitle {
        color: var(--ink-3);
        font-size: 13px;
      }

      .skills-search {
        padding: 10px 12px;
        margin-bottom: 8px;
      }

      .skill-check {
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .skill-avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--ink-3);
        font-size: 15px;
      }

      .skills-heading {
        color: var(--ink-3);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-top: 6px;
      }

      .skill-row {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 9px 2px;
        border-radius: var(--radius-sm);
      }

      .skill-row:hover {
        background: var(--surface-2);
      }

      .skill-info {
        display: grid;
        gap: 3px;
        min-width: 0;
        flex: 1;
      }

      .skill-name {
        font-size: 13px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .skill-desc {
        color: var(--ink-2);
        font-size: 12px;
      }

      .skill-meta {
        color: var(--ink-3);
        font-size: 11px;
      }

      .skill-action {
        white-space: nowrap;
        flex-shrink: 0;
      }

      .skills-empty,
      .skills-notice {
        color: var(--ink-3);
        font-size: 12px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 9px;
        background: var(--surface-2);
        color: var(--ink-2);
        font-size: 11px;
        white-space: nowrap;
      }

      .ok {
        color: var(--add);
      }
      .warn {
        color: var(--warn);
      }
      .danger {
        color: var(--del);
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
        }

        aside {
          grid-template-rows: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 42vh;
          overflow: auto;
        }

        .topbar-title {
          max-width: 38%;
        }

        .tool-row {
          padding-left: 0;
        }

        .setup-backdrop {
          align-items: start;
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./frontend.js"></script>
  </body>
</html>
