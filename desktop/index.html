<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget makes Chrome shrink the layout viewport when the
         on-screen keyboard opens, so the flex shell compresses (topbar stays,
         composer sits above the keyboard) instead of the whole page panning
         up. Safari ignores the key. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>SeekMoon</title>
    <!-- Makes the browser console installable; desktop/pwa/README.md explains
         the manifest's fixed identity and the two icon sets. The colors are
         the light and dark canvas. -->
    <link rel="manifest" href="/assets/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SeekMoon" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbf9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181d" />
    <!-- The one document for both the proton window and the console page
         openseek-api serves; package/build.mjs ships it unchanged, with
         frontend.js and these sidecars under /assets/ in every host. Page
         routes such as /device/... never move these root-absolute paths. -->
    <!-- The embedded code viewer's styles, assembled from the editor dependency
         by package/build.mjs. -->
    <link rel="stylesheet" href="/assets/vendor/pdfjs/web/pdf_viewer.css" />
    <link rel="stylesheet" href="/assets/viewer.css" />
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="stylesheet" href="/assets/page-thumbnails.css" />
    <!-- Generated from the pinned xterm sources alongside xterm.js below. -->
    <link rel="stylesheet" href="/assets/xterm.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- The packager combines pinned xterm distributions with the adapter that
         exposes their constructors through the __openseek_xterm global. -->
    <script src="/assets/xterm.js"></script>
    <script type="module" src="/assets/relative-time.js"></script>
    <script src="/assets/snapdom.js"></script>
    <script type="module" src="/assets/frontend.js"></script>
  </body>
</html>
