<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenSeek session viewer</title>
  <style>
    /* System (follow the OS via prefers-color-scheme, tracked live with no JS
       listener) is the default. `data-theme="light"` / `data-theme="dark"`
       force a fixed palette. */
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #eef1f5;
      --border: #d7dce3;
      --text: #1c2027;
      --muted: #5b6472;
      --accent: #2563eb;
      --on-accent: #ffffff;
      --user: #2f5bd6;
      --user-card: #f1f3f7;
      --user-card-border: #dfe3ea;
      --user-card-shadow: 0 1px 3px rgba(28, 32, 39, .07), 0 10px 24px rgba(28, 32, 39, .1);
      --assistant: #1a8f63;
      --tool: #8a6d10;
      --error: #c2334a;
      --warn: #9a6700;
      --added: #1a8f63;
      --runtime: #6d4fb0;
      --summary: #b5701f;
      --terminal: #2b7e9e;
      --summary-bg: #fbf3e6;
      --notice-warn-bg: #fdf3e0;
      --notice-error-bg: #fbe9ec;
      --badge-finished-bg: #dff3e6; --badge-finished-fg: #1a7a45;
      --badge-aborted-bg: #fbeed1; --badge-aborted-fg: #8a6d10;
      --badge-interrupted-bg: #e6e9ef; --badge-interrupted-fg: #4a5263;
      --badge-failed-bg: #fbe0e5; --badge-failed-fg: #b02a43;
      --token-keyword: #0000ff; --token-variable: #001080;
      --token-string: #a31515; --token-number: #098658;
      --token-comment: #008000; --token-punctuation: #3b3b3b;
      --token-function: #795e26; --token-type: #267f99;
      --token-string-escape: #ee0000; --token-regexp: #811f3f;
      --token-invalid: #cd3131;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1117;
      --panel: #161922;
      --panel-2: #1d212c;
      --border: #2a2f3a;
      --text: #d7dbe4;
      --muted: #8a92a4;
      --accent: #6ea8fe;
      --on-accent: #0b0d12;
      --user: #6f93ff;
      --user-card: #21252f;
      --user-card-border: #353b49;
      --user-card-shadow: 0 1px 3px rgba(0, 0, 0, .3), 0 12px 28px rgba(0, 0, 0, .35);
      --assistant: #36c08a;
      --tool: #c9a227;
      --error: #e0556b;
      --warn: #d4a72c;
      --added: #36c08a;
      --runtime: #9a7bd6;
      --summary: #d98a3a;
      --terminal: #5fa8c7;
      --summary-bg: #1c1812;
      --notice-warn-bg: #3a2f12;
      --notice-error-bg: #3a1620;
      --badge-finished-bg: #14361f; --badge-finished-fg: #5fd08a;
      --badge-aborted-bg: #3a2f12; --badge-aborted-fg: #e0b257;
      --badge-interrupted-bg: #2a2f3a; --badge-interrupted-fg: #9fb0c9;
      --badge-failed-bg: #3a1620; --badge-failed-fg: #ef8098;
      --token-keyword: #569cd6; --token-variable: #9cdcfe;
      --token-string: #ce9178; --token-number: #b5cea8;
      --token-comment: #6a9955; --token-punctuation: #cccccc;
      --token-function: #dcdcaa; --token-type: #4ec9b0;
      --token-string-escape: #d7ba7d; --token-regexp: #d16969;
      --token-invalid: #f44747;
    }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #161922;
        --panel-2: #1d212c;
        --border: #2a2f3a;
        --text: #d7dbe4;
        --muted: #8a92a4;
        --accent: #6ea8fe;
        --on-accent: #0b0d12;
        --user: #6f93ff;
        --user-card: #21252f;
        --user-card-border: #353b49;
        --user-card-shadow: 0 1px 3px rgba(0, 0, 0, .3), 0 12px 28px rgba(0, 0, 0, .35);
        --assistant: #36c08a;
        --tool: #c9a227;
        --error: #e0556b;
      --warn: #d4a72c;
        --added: #36c08a;
        --runtime: #9a7bd6;
        --summary: #d98a3a;
        --terminal: #5fa8c7;
        --summary-bg: #1c1812;
        --notice-warn-bg: #3a2f12;
        --notice-error-bg: #3a1620;
        --badge-finished-bg: #14361f; --badge-finished-fg: #5fd08a;
        --badge-aborted-bg: #3a2f12; --badge-aborted-fg: #e0b257;
        --badge-interrupted-bg: #2a2f3a; --badge-interrupted-fg: #9fb0c9;
        --badge-failed-bg: #3a1620; --badge-failed-fg: #ef8098;
        --token-keyword: #569cd6; --token-variable: #9cdcfe;
        --token-string: #ce9178; --token-number: #b5cea8;
        --token-comment: #6a9955; --token-punctuation: #cccccc;
        --token-function: #dcdcaa; --token-type: #4ec9b0;
        --token-string-escape: #d7ba7d; --token-regexp: #d16969;
        --token-invalid: #f44747;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .15s ease, color .15s ease;
    }
    .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    .app.sidebar-hidden { grid-template-columns: minmax(0, 1fr); }

    /* sidebar: fixed head, scrolling list, pinned theme footer */
    .sidebar {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow: hidden;
    }
    .sidebar-head { padding: 16px 16px 8px; }
    .sidebar-title-row { display: flex; align-items: center; gap: 8px; }
    .brand { font-size: 15px; margin: 0 0 4px; letter-spacing: .2px; }
    .status { color: var(--muted); font-size: 12px; }
    .sidebar-hide-button,
    .sidebar-show-button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.2;
    }
    .sidebar-hide-button {
      margin-left: auto;
      padding: 4px 9px;
    }
    .sidebar-show-button { padding: 6px 12px; }
    .sidebar-hide-button:hover,
    .sidebar-show-button:hover { border-color: var(--accent); }
    .sidebar-empty { padding: 8px 16px; color: var(--muted); font-style: italic; }
    .session-list { flex: 1 1 auto; overflow-y: auto; margin: 0; padding: 8px 12px; }
    .session-root { margin-bottom: 10px; }
    .session-root-toggle {
      width: 100%;
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      padding: 6px 4px 5px;
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 11px;
      font-family: ui-monospace, monospace;
      cursor: pointer;
      text-align: left;
    }
    .session-root-toggle:hover { color: var(--text); }
    .session-root-caret {
      text-align: center;
      font-size: 10px;
    }
    .session-root-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-root-count {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 6px;
      font-size: 10px;
    }
    .session-root-sessions {
      list-style: none;
      margin: 0;
      padding: 0 0 0 10px;
      border-left: 1px solid var(--border);
    }
    .session-item {
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .session-item:hover { background: var(--panel-2); }
    .session-item.selected { background: var(--panel-2); border-color: var(--accent); }
    .session-item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-family: ui-monospace, monospace;
    }
    .session-item-id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-item-time { flex: 0 0 auto; }

    /* theme switcher */
    .theme-toggle { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--border); }
    .theme-button {
      flex: 1;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 0; cursor: pointer; font-size: 12px;
    }
    .theme-button:hover { border-color: var(--accent); }
    .theme-button.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

    /* main: no top padding on the scroll container itself, so the sticky toolbar
       can pin flush to the very top. The 20px top breathing room moves onto the
       content (.session-view / .main-toolbar) where it scrolls away normally. */
    .main { overflow-y: auto; padding: 0 28px; }
    .session-view { padding-top: 20px; }
    .main-toolbar {
      min-height: 34px;
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 6px;
    }
    .placeholder { color: var(--muted); margin-top: 40px; text-align: center; }
    .header-strip {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .header-id { font-family: ui-monospace, monospace; font-size: 16px; }
    .header-meta { color: var(--muted); font-size: 12px; }

    /* mode toggle */
    /* sticky toolbar: keeps the view/args toggles + filter bars pinned to the top
       of the scrolling .main while reading a long log. Negative side margins let
       its background span the .main padding gutter so content can't peek beside it. */
    .sticky-toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      margin: 0 -28px 16px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
    }
    .sticky-toolbar .mode-row { margin-bottom: 0; }
    .sticky-toolbar .filter-bars { margin: 10px 0 0; }
    /* All filter bars share one wrapping row so the sticky toolbar keeps the
       height the anchor offsets account for; the bars' standalone margins
       are the container's job here. */
    .filter-bars { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
    .filter-bars .error-bar,
    .filter-bars .escalated-bar,
    .filter-bars .build-error-bar { margin: 0; }
    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 16px;
    }
    .mode-cluster { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
    .mode-toggle { display: flex; align-items: center; gap: 8px; }
    .args-toggle-label { color: var(--muted); font-size: 12px; margin-right: 2px; }
    .mode-button {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 5px 14px; cursor: pointer; font-size: 13px;
    }
    .mode-button:hover { border-color: var(--accent); }
    .mode-button.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    /* step scrubber: one segment per agent step; click jumps to that step's
       card (via the seq-N anchors), red segments carry failed tool results,
       and the scrollspy marks the segment you are reading */
    .step-scrubber {
      display: flex;
      align-items: stretch;
      flex: 1 1 180px;
      min-width: 120px;
      max-width: 420px;
      height: 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      overflow: hidden;
      cursor: pointer;
    }
    .step-seg { flex: 1 1 auto; min-width: 1px; }
    .step-seg:hover { background: var(--accent); }
    .step-seg.has-error { background: var(--error); opacity: .45; }
    .step-seg.has-error:hover { background: var(--error); opacity: 1; }
    .step-seg.current { background: var(--accent); }
    /* instant hover tooltip (positioned by the shell): "Step N/M" */
    .scrubber-tip {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      padding: 3px 9px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    /* anchored cards scroll to just below the sticky toolbar */
    [id^="seq-"] { scroll-margin-top: 105px; }

    .session-metadata {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .session-metadata span {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--panel);
      white-space: nowrap;
    }

    /* find-failures bar */
    .error-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: -6px 0 16px; }
    .error-count { color: var(--error); font-size: 12px; font-weight: 600; margin-right: 2px; }
    .error-toggle, .error-jump {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 12px; cursor: pointer; font-size: 12px;
    }
    .error-jump { padding: 4px 11px; font-family: ui-monospace, monospace; }
    .error-toggle:hover, .error-jump:hover { border-color: var(--error); }
    .error-toggle.active { background: var(--error); color: #fff; border-color: var(--error); }
    .turn-error-badge { color: var(--error); }
    .turn-steer-badge { color: var(--user); }
    .errors-only-empty { color: var(--muted); margin-top: 24px; }
    /* errors-only: keep failed tool-result cards AND the assistant card holding the
       failing call (so the call and its result stay as two cells), plus the turns
       containing an error; hide everything else. */
    .session-view.errors-only .card:not(.error):not(.assistant) { display: none; }
    .session-view.errors-only .card.assistant:not(:has(.tool-call-failed)) { display: none; }
    .session-view.errors-only .turn:not(:has(.card.error)) { display: none; }

    /* escalated-only: derive the audit view from durable tool-call arguments.
       Keep each top-level escalated:true call and its unambiguously paired result;
       hide unrelated calls inside an otherwise retained assistant card. */
    .escalated-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: -6px 0 16px; }
    .escalated-count { color: var(--accent); font-size: 12px; font-weight: 600; margin-right: 2px; }
    .escalated-toggle, .escalated-jump {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 12px; cursor: pointer; font-size: 12px;
    }
    .escalated-jump { padding: 4px 11px; font-family: ui-monospace, monospace; }
    .escalated-toggle:hover, .escalated-jump:hover { border-color: var(--accent); }
    .escalated-toggle.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .escalated-only-empty { color: var(--muted); margin-top: 24px; }
    .session-view.escalated-only .card:not(.assistant):not(.tool.escalated) { display: none; }
    .session-view.escalated-only .card.assistant:not(:has(.tool-call-escalated)) { display: none; }
    .session-view.escalated-only .card.assistant .tool-call:not(.tool-call-escalated) { display: none; }
    .session-view.escalated-only .turn:not(:has(.tool-call-escalated)):not(:has(.card.tool.escalated)) { display: none; }

    /* mbtx failure-stage words: a build error is a source problem (amber),
       a runtime error keeps the failure red. */
    .tool-stage-build { color: var(--warn); font-weight: 600; }
    /* A build-failed call row says its stage through its own brief ("build
       failed" is in the label), tinted amber — no appended word repeats it. */
    .tool-call-build-failed .tool-call-brief { color: var(--warn); font-weight: 600; }
    .tool-stage-run { color: var(--error); font-weight: 600; }
    .tool-flag.tool-stage-build { color: var(--warn); }

    /* build-errors-only: find compile errors. Keep each mbtx call whose result
       brief says the BUILD failed, its paired result card (tagged build-failed),
       and their turns; hide everything else. */
    .build-error-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: -6px 0 16px; }
    .build-error-count { color: var(--warn); font-size: 12px; font-weight: 600; margin-right: 2px; }
    .build-error-toggle, .build-error-jump {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 12px; cursor: pointer; font-size: 12px;
    }
    .build-error-jump { padding: 4px 11px; font-family: ui-monospace, monospace; }
    .build-error-toggle:hover, .build-error-jump:hover { border-color: var(--warn); }
    .build-error-toggle.active { background: var(--warn); color: var(--on-accent); border-color: var(--warn); }
    .build-errors-only-empty { color: var(--muted); margin-top: 24px; }
    .session-view.build-errors-only .card:not(.assistant):not(.tool.build-failed) { display: none; }
    .session-view.build-errors-only .card.assistant:not(:has(.tool-call-build-failed)) { display: none; }
    .session-view.build-errors-only .card.assistant .tool-call:not(.tool-call-build-failed) { display: none; }
    .session-view.build-errors-only .turn:not(:has(.tool-call-build-failed)):not(:has(.card.tool.build-failed)) { display: none; }

    /* notices */
    .notices { margin-bottom: 16px; }
    .notice { border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
    .notice-warn { background: var(--notice-warn-bg); border: 1px solid var(--summary); }
    .notice-error { background: var(--notice-error-bg); border: 1px solid var(--error); }
    .notice-head { font-weight: 600; }
    .notice-body { margin: 6px 0 0; font-size: 12px; opacity: .85; white-space: pre-wrap; }

    /* turns + cards */
    .turn { margin-bottom: 14px; }
    .turn-summary {
      cursor: pointer; color: var(--muted); font-size: 12px;
      text-transform: uppercase; letter-spacing: .5px; padding: 4px 0;
    }
    .turn-body { padding-left: 4px; }
    .card {
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: 8px;
      background: var(--panel);
      padding: 10px 14px;
      margin: 8px 0;
    }
    .card.user { border-left-color: var(--user); }
    /* The user's own words are the one thing in a log nobody generated, and a
       left rail three pixels wide did not say so. A typed prompt — or a steer
       dropped mid-turn — gets a Codex-style card: a raised surface with a
       shadow, the prompt set in bold headline type, and the caption tucked
       underneath it, so the human side of the conversation is findable at a
       glance in a wall of tool cards. The engine's auto-continue prompt and
       a sub-run child's task from its parent are user-role messages too, so
       they keep the plain flat card, muted, and say who wrote them. */
    .card.user.typed {
      display: flex; flex-direction: column;
      max-width: 92%;
      background: var(--user-card);
      border-color: var(--user-card-border);
      border-left-width: 1px;
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: var(--user-card-shadow);
    }
    .card.user.typed > .card-label { order: 1; margin: 8px 0 0; }
    .card.user.typed .content {
      font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1.5;
    }
    /* Codex-style prompt navigator: a sticky column of tick marks in the
       log's left gutter, one per typed prompt. Hovering a tick raises the
       same card the prompt itself wears; clicking jumps to the prompt's
       seq- anchor. The nav is height 0 so it never displaces the cards. */
    .log { position: relative; }
    .prompt-rail { position: sticky; top: 130px; height: 0; z-index: 45; }
    .rail-marks {
      position: absolute; left: -24px; top: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .rail-mark {
      position: relative; display: block; width: 22px; padding: 2px 0;
      text-decoration: none;
    }
    .rail-tick {
      display: block; width: 15px; height: 3px; border-radius: 2px;
      background: var(--user); opacity: .5;
    }
    .rail-mark:hover .rail-tick, .rail-mark:focus-visible .rail-tick { opacity: 1; }
    .rail-preview {
      display: none; position: absolute; left: 22px; top: -10px;
      width: min(520px, 60vw);
      background: var(--user-card);
      border: 1px solid var(--user-card-border);
      border-radius: 14px;
      box-shadow: var(--user-card-shadow);
      padding: 14px 18px;
    }
    .rail-mark:hover .rail-preview, .rail-mark:focus-visible .rail-preview {
      display: block;
    }
    .rail-preview-text { font-weight: 600; font-size: 14px; color: var(--text); }
    .rail-preview-time {
      margin-top: 6px; font-size: 11.5px; color: var(--muted);
      font-family: ui-monospace, monospace;
    }
    .rail-preview-errors {
      margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--error);
    }
    .rail-preview-reply {
      margin: 8px 0 0; padding: 0 0 0 10px;
      border-left: 2px solid var(--border);
      color: var(--muted); font-size: 12.5px; line-height: 1.45;
    }
    .card.user.auto-continue, .card.user.delegated {
      border-left-color: var(--muted);
    }
    .card.user.auto-continue > .card-body, .card.user.delegated > .card-body {
      color: var(--muted);
    }
    .card.assistant { border-left-color: var(--assistant); }
    .card.tool { border-left-color: var(--tool); }
    .card.tool.error { border-left-color: var(--error); background: var(--notice-error-bg); }
    .card.runtime { border-left-color: var(--runtime); }
    /* plan checklists — shared by `plan` tool calls and plan-cadence reminders:
       icon + numbered title rows, statuses as classes, delta chips for what
       changed against the previous plan call, ghost rows for dropped steps. */
    .plan-steps { margin: 8px 0 0; padding: 0; font-size: 12.5px; list-style: none; }
    .plan-step { margin: 3px 0; display: flex; align-items: baseline; gap: 7px; }
    .plan-step .step-icon {
      flex: 0 0 auto; width: 15px; text-align: center;
      font-size: 12px; color: var(--muted);
    }
    .plan-step.completed .step-icon { color: var(--added); }
    .plan-step.in_progress .step-icon { color: var(--accent); }
    .plan-step.dropped .step-icon { color: var(--error); }
    /* a status this build does not know renders as its literal word */
    .plan-step .step-status {
      flex: 0 0 auto; font-family: ui-monospace, monospace; font-size: 11px;
      color: var(--muted); border: 1px solid var(--border);
      border-radius: 4px; padding: 0 5px;
    }
    .plan-step .step-num {
      flex: 0 0 auto; color: var(--muted);
      font-family: ui-monospace, monospace; font-size: 11.5px;
    }
    .plan-step .step-title { min-width: 0; overflow-wrap: anywhere; }
    .plan-step.completed .step-title { color: var(--muted); text-decoration: line-through; }
    .plan-step.in_progress .step-title { font-weight: 600; }
    .plan-step.dropped .step-title { color: var(--muted); text-decoration: line-through; opacity: .75; }
    .plan-step .step-delta {
      flex: 0 0 auto; font-size: 10px; text-transform: uppercase; letter-spacing: .4px;
      border: 1px solid var(--border); border-radius: 999px; padding: 0 6px;
      line-height: 1.6; color: var(--muted); background: var(--panel-2);
      align-self: center;
    }
    .step-delta.step-delta-done { color: var(--added); border-color: var(--added); }
    .step-delta.step-delta-started { color: var(--accent); border-color: var(--accent); }
    .step-delta.step-delta-new { color: var(--runtime); border-color: var(--runtime); }
    .step-delta.step-delta-reopened,
    .step-delta.step-delta-dropped { color: var(--error); border-color: var(--error); }

    /* plan progress meter: proportional fill + completed/total tally; the fill
       goes green only when the plan is fully completed */
    .plan-progress { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; }
    .plan-progress-track {
      flex: 0 1 220px; height: 6px; border-radius: 999px;
      background: var(--panel-2); border: 1px solid var(--border); overflow: hidden;
    }
    .plan-progress-fill {
      height: 100%; border-radius: 999px; background: var(--accent);
      transition: width .2s ease;
    }
    .plan-progress-fill.complete { background: var(--added); }
    .plan-progress-count {
      font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted);
    }
    .plan-rewrite-note { color: var(--muted); font-size: 11px; font-style: italic; margin: 2px 0; }

    /* folded plan calls: a per-step status ribbon next to the tool name, so the
       plan's shape reads at a glance while every card stays collapsed */
    .plan-ribbon {
      display: inline-flex; gap: 2px; margin-left: 8px; vertical-align: middle;
    }
    .plan-ribbon-seg {
      width: 9px; height: 7px; border-radius: 2px;
      background: var(--panel-2); border: 1px solid var(--border);
    }
    .plan-ribbon-seg.completed { background: var(--added); border-color: var(--added); }
    .plan-ribbon-seg.in_progress { background: var(--accent); border-color: var(--accent); }
    .plan-args { margin: 2px 0 0; }
    .plan-cleared { color: var(--muted); font-style: italic; font-size: 12px; }

    /* goal notices: the standing goal is the payload — shown as a marked
       block — while the fixed assessment boilerplate folds away beneath it */
    .goal-text {
      display: flex; gap: 8px; align-items: baseline;
      margin: 2px 0; padding: 8px 10px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-left: 3px solid var(--runtime); border-radius: 6px;
    }
    .goal-icon { flex: 0 0 auto; }
    .goal-text-body {
      margin: 0; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px; font-weight: 600; min-width: 0;
    }
    .goal-boilerplate { margin-top: 6px; }
    .goal-boilerplate > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    .goal-boilerplate .content { color: var(--muted); }
    .card.goal-blocked { border-left-color: var(--error); background: var(--notice-error-bg); }
    .card.goal-unblocked { border-left-color: var(--added); }
    .goal-cleared-note { color: var(--muted); font-style: italic; font-size: 12px; }
    .card.summary { border-left-color: var(--summary); background: var(--summary-bg); }
    .card.terminal { border-left-color: var(--terminal); }
    .card.system { border-left-color: var(--muted); }
    .card-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); margin-bottom: 6px; cursor: default;
    }
    .card-seq { font-family: ui-monospace, monospace; margin-right: 8px; opacity: .7; }
    .card-step {
      font-family: ui-monospace, monospace;
      margin-left: 8px;
      opacity: .75;
      text-transform: none;
      letter-spacing: 0;
    }
    .card-ts { font-family: ui-monospace, monospace; margin-left: 8px; opacity: .55; font-weight: normal; }
    .content {
      margin: 0; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    }
    /* Static workspace-file projections used by standalone exports. The
       original fence remains in the embedded JSONL; this card carries no
       local path action and never loads workspace bytes. */
    .workspace-file-card {
      display: flex; align-items: center; gap: 8px;
      width: min(100%, 520px); min-width: 0;
      margin: 8px 0; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--panel-2); color: var(--text); text-align: left;
    }
    .workspace-file-card-static { cursor: default; }
    .workspace-file-glyph {
      display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
      width: 16px; height: 16px;
      color: var(--accent);
    }
    .workspace-file-glyph svg {
      width: 16px; height: 16px;
    }
    .workspace-file-glyph.spreadsheet { color: #18a058; }
    .workspace-file-glyph.document,
    .workspace-file-glyph.text { color: #4b82d9; }
    .workspace-file-glyph.presentation { color: #d97831; }
    .workspace-file-glyph.image { color: #8a68c7; }
    .workspace-file-glyph.pdf { color: #c34f5d; }
    .workspace-file-glyph.archive { color: #a17b26; }
    .workspace-file-glyph.code { color: #2c9a94; }
    .workspace-file-copy { display: grid; min-width: 0; gap: 2px; }
    .workspace-file-name {
      min-width: 0; overflow: hidden; color: var(--text);
      font-size: 14px; font-weight: 600; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .workspace-file-kind { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); font-style: italic; }

    /* assistant reasoning + tool calls */
    .reasoning { margin: 0 0 8px; }
    .reasoning > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    .reasoning .content { color: var(--muted); }
    .tool-calls { margin-top: 8px; }
    .tool-call { border: 1px dashed var(--border); border-radius: 6px; padding: 6px 10px; margin-top: 6px; }
    .tool-call-name { font-size: 13px; }
    .tool-call-brief { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
    details.tool-call > summary.tool-call-name { cursor: pointer; }
    details.tool-call[open] > summary.tool-call-name { margin-bottom: 4px; }
    .tool-call-args { margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }

    /* friendly tool-args: one key: value row per field, values shown verbatim */
    .tool-call-args-rendered { margin: 0; font-size: 12px; }
    .arg-field { margin: 3px 0; }
    .arg-key { color: var(--accent); font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; }
    .arg-key::after { content: ": "; color: var(--muted); font-weight: 400; }
    .arg-value-inline { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .arg-value {
      margin: 3px 0 0; padding: 6px 8px;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
      white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, monospace; font-size: 12px;
    }
    /* MoonBit source uses the editor lexer and its Monaco token color ids. */
    .moonbit-source .mtk1 { color: var(--text); }
    .moonbit-source .mtk3 { color: var(--token-keyword); }
    .moonbit-source .mtk4 { color: var(--token-variable); }
    .moonbit-source .mtk5 { color: var(--token-string); }
    .moonbit-source .mtk6 { color: var(--token-number); }
    .moonbit-source .mtk7 { color: var(--token-comment); }
    .moonbit-source .mtk8 { color: var(--token-punctuation); }
    .moonbit-source .mtk9 { color: var(--token-type); }
    .moonbit-source .mtk10 { color: var(--token-function); }
    .moonbit-source .mtk11 { color: var(--token-string-escape); }
    .moonbit-source .mtk12 { color: var(--token-regexp); }
    .moonbit-source .mtk13 { color: var(--token-invalid); }
    .read-moonbit-output { display: block; }
    .read-moonbit-line, .moonbit-line {
      display: grid; grid-template-columns: max-content minmax(0, 1fr);
      column-gap: 1ch; align-items: start;
    }
    .read-moonbit-gutter, .moonbit-gutter {
      color: var(--muted); text-align: right; white-space: pre; user-select: none;
    }
    .read-moonbit-code, .moonbit-code {
      min-width: 0; color: var(--text); font: inherit;
      white-space: pre-wrap; word-break: break-word;
    }
    .moonbit-skip { color: var(--muted); }
    .read-moonbit-status {
      display: block; color: var(--muted);
      white-space: pre-wrap; word-break: break-word;
    }
    /* nested args: objects/arrays recurse into indented rows, not a JSON blob */
    .arg-object { margin: 2px 0 2px 2px; padding-left: 8px; border-left: 1px solid var(--border); }
    .arg-array { margin: 2px 0 2px 2px; }
    .arg-item {
      margin: 3px 0; padding: 1px 0 1px 8px;
      border-left: 2px solid var(--border);
    }

    /* synthesized `generated_diff`: colored per-line diff (+ added, - removed) */
    .diff-block {
      margin: 3px 0 0; padding: 4px 8px;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
      font-family: ui-monospace, monospace; font-size: 12px;
    }
    .diff-add, .diff-del, .diff-ctx { white-space: pre-wrap; word-break: break-word; }
    .diff-add { color: var(--added, #1a8f63); }
    .diff-del { color: var(--error); }
    .diff-ctx { color: var(--muted); }

    /* tool-args toggle: friendly form by default, raw JSON under .show-original */
    .tool-call-args-original { display: none; }
    .session-view.show-original .tool-call-args-original { display: block; }
    .session-view.show-original .tool-call-args-rendered { display: none; }

    /* a tool call whose result failed: tint its border so it stands out, and let
       errors-only keep the assistant card that holds it. */
    .tool-call-failed { border-color: var(--error); }
    .tool-call-escalated { border-color: var(--accent); }

    /* call <-> result pairing: the same `call N` chip on a tool call and its
       result, each an anchor that jumps to its partner. When one assistant turn
       fires several tool calls, this is what ties each result card back to the
       call that produced it. */
    .tool-link {
      font-family: ui-monospace, monospace; font-size: 11px;
      color: var(--accent); text-decoration: none; margin-left: 8px;
      text-transform: none; letter-spacing: 0; opacity: .85; white-space: nowrap;
    }
    .tool-link:hover { text-decoration: underline; opacity: 1; }
    /* subagent chip on explore/review result cards: navigates (via #s=) to
       the child's own session; the inline transcript nests the child's raw
       log inside the parent card, visually set off by an accent rail. */
    .subrun-link {
      font-family: ui-monospace, monospace; font-size: 11px;
      color: var(--accent); text-decoration: none; margin-left: 8px;
      text-transform: none; letter-spacing: 0; opacity: .85; white-space: nowrap;
    }
    .subrun-link:hover { text-decoration: underline; opacity: 1; }
    .subrun-transcript {
      margin-top: 10px; border-left: 3px solid var(--accent);
      padding-left: 10px; background: var(--panel-2); border-radius: 4px;
    }
    .subrun-transcript-label {
      cursor: pointer; font-size: 12px; color: var(--muted);
      padding: 6px 4px; user-select: none;
    }
    .subrun-transcript-body { padding: 4px 6px 8px; }
    .subrun-transcript-body .log { margin: 0; }
    /* a subagent session nested under its parent in the sidebar */
    .session-item.session-child { margin-left: 14px; opacity: .9; }
    /* highlight the call/result you jumped to via a pairing chip (the class
       form is what the click handler sets — it cannot use location.hash,
       which carries the viewer's s/v/seq position state) */
    .tool-call:target, .card:target,
    .tool-call.jump-target, .card.jump-target {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* folded tool-result cards: the label is the toggle, body hides until clicked */
    details.card > summary.card-label { cursor: pointer; }
    details.card > summary.card-label:hover { color: var(--text); }
    .tool-flag {
      color: var(--error); font-weight: 700; margin-right: 8px;
      text-transform: none; letter-spacing: 0;
    }

    /* badges */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px;
    }
    .badge-finished { background: var(--badge-finished-bg); color: var(--badge-finished-fg); }
    .badge-aborted { background: var(--badge-aborted-bg); color: var(--badge-aborted-fg); }
    .badge-interrupted { background: var(--badge-interrupted-bg); color: var(--badge-interrupted-fg); }
    .badge-failed { background: var(--badge-failed-bg); color: var(--badge-failed-fg); }

    .empty-state { color: var(--muted); margin-top: 24px; }

    /* ---- trajectory waterfall -------------------------------------------------
       One run's whole timeline: every session it spawned, every turn, every
       step, laid out on one clock. Rows are a two-column grid (label | track)
       with the duration trailing, so bars line up vertically across sessions
       however deeply a row is indented. */
    .trajectory-open {
      margin-left: auto; align-self: center;
      font-size: 12px; color: var(--accent); text-decoration: none;
      border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px;
      white-space: nowrap;
    }
    .trajectory-open:hover { border-color: var(--accent); }

    .trajectory-totals {
      color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
      display: flex; flex-wrap: wrap; gap: 4px 14px;
    }

    /* One column template for every band of the view — scale, ruler, activity
       strip, rows and their grid — so a mark above a bar names the same
       instant as the bar itself. */
    .trajectory-view {
      --wf-columns: minmax(240px, 34%) 1fr 72px;
    }
    .waterfall { padding: 4px 0 60px; }
    .waterfall-row {
      display: grid;
      grid-template-columns: var(--wf-columns);
      align-items: center;
      gap: 10px;
      padding: 2px 0;
      border-radius: 4px;
    }
    .waterfall-virtual .waterfall-row {
      height: 32px;
      box-sizing: border-box;
    }
    .waterfall-virtual .waterfall-label {
      white-space: nowrap;
      overflow: hidden;
    }
    .waterfall-spacer {
      pointer-events: none;
    }
    /* Zebra rows: at a few hundred rows the eye needs a guide back from a bar
       to its label. */
    .waterfall-row.waterfall-row-even,
    .waterfall-row:nth-child(even) {
      background: color-mix(in srgb, var(--panel-2) 55%, transparent);
    }
    .waterfall-row:hover { background: var(--panel-2); }
    .snapshot-banner {
      margin: 8px 0 0;
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid color-mix(in srgb, var(--summary) 45%, var(--border));
      background: color-mix(in srgb, var(--summary) 10%, var(--panel));
      color: var(--text);
      font-size: 12px;
    }
    .session-timeline-link {
      margin-left: auto;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      text-decoration: none;
      flex: none;
    }
    .session-item:hover .session-timeline-link,
    .session-timeline-link:hover {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
      background: var(--panel);
    }
    .waterfall-row.critical { background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .waterfall-row.critical .waterfall-bar { box-shadow: 0 0 0 1px var(--accent); }
    .waterfall-row.job-focus {
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      outline: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .waterfall-label {
      display: flex; align-items: baseline; gap: 6px;
      min-width: 0; font-size: 12.5px;
    }
    .waterfall-toggle {
      width: 14px; height: 14px; flex: none; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: none; border: 0; border-radius: 3px;
      color: var(--muted); font-size: 10px; line-height: 1; cursor: pointer;
    }
    .waterfall-toggle:hover { color: var(--text); background: var(--border); }
    .waterfall-toggle.placeholder { cursor: default; background: none; }
    .waterfall-dot {
      width: 7px; height: 7px; border-radius: 50%; flex: none;
      background: var(--muted);
    }
    .waterfall-name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: ui-monospace, monospace;
    }
    .waterfall-caption {
      color: var(--muted); font-size: 11px; flex: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 45%;
    }
    .waterfall-track {
      position: relative; height: 14px;
      background: var(--panel-2); border-radius: 3px; overflow: hidden;
    }
    .waterfall-bar {
      position: absolute; top: 3px; bottom: 3px; border-radius: 3px;
      background: var(--muted);
      /* A sub-pixel bar is a missing bar: keep every step on screen. */
      min-width: 2px;
    }
    .waterfall-duration {
      color: var(--muted); font-size: 11px; text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* A run and a turn are envelopes around the work, so their bars sit a
       little taller than the steps nested in them. */
    .kind-run .waterfall-bar, .kind-turn .waterfall-bar { top: 0; bottom: 0; }

    /* Kind colours reuse the palette the log cards already use. */
    .waterfall-swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .kind-turn .waterfall-bar, .waterfall-swatch.kind-turn { background: var(--accent); }
    .kind-turn .waterfall-dot { background: var(--accent); }
    .kind-llm .waterfall-bar, .waterfall-swatch.kind-llm { background: var(--assistant); }
    .kind-llm .waterfall-dot { background: var(--assistant); }
    .kind-tool .waterfall-bar, .waterfall-swatch.kind-tool { background: var(--tool); }
    .kind-tool .waterfall-dot { background: var(--tool); }
    .kind-workflow .waterfall-bar, .waterfall-swatch.kind-workflow { background: var(--runtime); }
    .kind-workflow .waterfall-dot { background: var(--runtime); }
    .kind-ptc .waterfall-bar, .waterfall-swatch.kind-ptc { background: var(--terminal); }
    .kind-ptc .waterfall-dot { background: var(--terminal); }
    .kind-job .waterfall-bar, .waterfall-swatch.kind-job { background: var(--summary); }
    .kind-job .waterfall-dot { background: var(--summary); }
    .kind-wait .waterfall-bar, .waterfall-swatch.kind-wait { background: var(--warn); }
    .kind-wait .waterfall-dot { background: var(--warn); }
    .kind-milestone .waterfall-bar, .waterfall-swatch.kind-milestone { background: var(--muted); }
    .kind-milestone .waterfall-bar { opacity: .75; }

    /* Outcome beats kind: a failed or interrupted step must read as one at a
       glance, so the bar keeps its place but takes the error colour. */
    .status-failed .waterfall-bar { background: var(--error); }
    .status-failed .waterfall-dot { background: var(--error); }
    .status-interrupted .waterfall-bar { opacity: .45; }
    .status-yielded .waterfall-bar { background: var(--summary); }
    .waterfall-row.open .waterfall-bar {
      border-top-right-radius: 0; border-bottom-right-radius: 0;
      background-image: linear-gradient(90deg, transparent 0 55%, rgba(255,255,255,.55) 55% 100%);
      background-size: 8px 100%;
    }

    .waterfall-legend {
      display: flex; flex-wrap: wrap; gap: 4px 14px;
      margin: 10px 0 0; color: var(--muted); font-size: 11.5px;
    }
    .waterfall-legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .waterfall-legend-label { text-transform: lowercase; }

    /* ---- a background job's log, opened under its row -------------------- */
    /* A job's output is its own file, not part of the transcript; the button in
       the row is the way in, and the block below is the file's tail. */
    .job-log-button {
      flex: none; margin-left: 2px; padding: 0 5px; height: 16px; border-radius: 3px;
      border: 1px solid var(--border); background: var(--panel);
      color: var(--muted); font-size: 10.5px; line-height: 1; cursor: pointer;
      font-family: ui-monospace, monospace;
    }
    .job-log-button:hover { color: var(--text); border-color: var(--accent); }
    /* Open, the button reads as pressed without becoming the loudest thing in
       the lane: a tinted chip, not a filled one. */
    .job-log-button[aria-expanded="true"] {
      color: var(--accent); border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, var(--panel));
    }
    .job-log {
      /* Above the axis grid, which is an absolute overlay across the rows:
         a dotted timeline line must not be drawn through the log text. */
      position: relative; z-index: 3;
      margin: 2px 0 8px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel-2); overflow: hidden;
    }
    .job-log-head {
      display: flex; align-items: baseline; gap: 10px;
      padding: 5px 10px; border-bottom: 1px solid var(--border);
      color: var(--muted); font-size: 11.5px;
    }
    .job-log-title {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: ui-monospace, monospace;
      /* The header is the only thing naming what was read; muted everywhere,
         it disappears on a dark palette. */
      color: var(--text);
    }
    .job-log-close {
      flex: none; background: none; border: 0; padding: 0;
      color: var(--muted); font-size: 11px; cursor: pointer;
    }
    .job-log-close:hover { color: var(--text); }
    .job-log-text {
      margin: 0; padding: 8px 10px; max-height: 320px; overflow: auto;
      font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
      background: var(--panel); color: var(--text);
    }
    .job-log-note {
      padding: 4px 10px; color: var(--muted); font-size: 11px;
      border-top: 1px solid var(--border);
    }
    .job-log-status { padding: 8px 10px; color: var(--muted); font-size: 11.5px; }
    /* A job that could not be read is an error, not an empty log: an empty box
       and a missing record must not look alike. */
    .job-log-error {
      padding: 8px 10px; font-size: 11.5px; color: var(--error);
      background: color-mix(in srgb, var(--error) 10%, transparent);
      border-left: 3px solid var(--error);
    }
    /* ---- trajectory headline cards -------------------------------------- */
    .trajectory-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
      gap: 10px;
      margin: 0 0 14px;
    }
    .stat {
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--panel); padding: 9px 12px;
      display: flex; flex-direction: column; gap: 2px; min-width: 0;
    }
    .stat-label {
      color: var(--muted); font-size: 10.5px; letter-spacing: .08em;
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums;
    }
    .stat-value.bad { color: var(--error); }
    .stat-note {
      color: var(--muted); font-size: 11px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .stat-jump {
      align-self: flex-start; margin-top: 2px; padding: 1px 8px;
      font-size: 11px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--panel-2);
      color: var(--accent); cursor: pointer;
    }
    .stat-jump:hover { border-color: var(--accent); }

    /* ---- trajectory ruler ------------------------------------------------
       One block per stretch of work; each narrow hatched slot is a folded idle
       stretch, labelled with how long it really was. Without it a reader
       cannot tell a two-second pause from a night. */
    .waterfall-ruler {
      display: grid;
      grid-template-columns: var(--wf-columns);
      gap: 10px; align-items: stretch;
      height: 26px;
      margin: 0 0 8px; border-bottom: 1px solid var(--border);
      font-size: 10px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    /* The blocks live in the same column and coordinate system as the bars, so
       the ruler boundaries align pixel-for-pixel with the grid and bars. */
    .ruler-blocks { position: relative; overflow: hidden; }
    .ruler-corner {
      align-self: center; text-align: right;
      font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
      opacity: .7;
    }
    .ruler-seg {
      position: absolute; top: 0; bottom: 0; box-sizing: border-box;
      background: color-mix(in srgb, var(--panel-2) 70%, transparent);
      border-right: 1px solid var(--border);
    }
    .ruler-tick { position: absolute; left: 4px; top: 6px; white-space: nowrap; }
    .ruler-gap {
      position: absolute; top: 0; bottom: 0; box-sizing: border-box;
      background: repeating-linear-gradient(45deg,
        var(--panel-2) 0 3px, transparent 3px 6px);
      border-right: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-size: 9px;
      writing-mode: vertical-rl; text-orientation: mixed;
    }

    /* ---- time scale ------------------------------------------------------
       Dated boundaries along the axis, cast down the rows as a hairline grid.
       "Nov 1" and "02:00" are how a reader finds the night inside a run that
       spans one. The scale is a row of the same grid as the bars, so a label
       sits exactly over the boundary its line marks. */
    .waterfall-scale {
      display: grid;
      grid-template-columns: var(--wf-columns);
      gap: 10px; align-items: end;
      height: 15px; margin: 0 0 2px;
      font-size: 10px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .scale-corner {
      font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
      text-align: right; opacity: .7;
    }
    .scale-track { position: relative; height: 15px; overflow: hidden; }
    .scale-label {
      position: absolute; top: 1px; padding-left: 4px; white-space: nowrap;
      border-left: 1px solid var(--border);
    }
    .scale-label.day {
      color: var(--text); font-weight: 600;
      border-left-color: var(--accent);
    }
    /* A mark at the right edge hangs its label to the left, or the track's
       overflow would clip it. */
    .scale-label.end {
      transform: translateX(-100%);
      padding-left: 0; padding-right: 4px;
      border-left: 0; border-right: 1px solid var(--border);
    }
    .scale-label.day.end { border-right-color: var(--accent); }
    .waterfall-body { position: relative; isolation: isolate; }
    .waterfall-grid {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      display: grid;
      grid-template-columns: var(--wf-columns);
      gap: 10px;
    }
    .waterfall-grid-track { position: relative; }
    .waterfall-grid-line {
      position: absolute; top: 0; bottom: 0; width: 0;
      border-left: 1px dotted color-mix(in srgb, var(--border) 85%, transparent);
    }
    .waterfall-grid-line.day {
      border-left-color: color-mix(in srgb, var(--accent) 40%, transparent);
    }
    /* Lane role: the run's own session (accent) or an agent it spawned. */
    .lane-role {
      flex: none; font-size: 9px; line-height: 1; cursor: help;
      color: var(--muted);
    }
    .lane-role-main { color: var(--accent); }

    /* ---- envelope ticks and the hover card ------------------------------ */
    .waterfall-tick {
      position: absolute; top: 6px; bottom: 6px; border-radius: 1px;
      min-width: 1px;
    }
    .waterfall-tick.kind-llm { background: var(--assistant); }
    .waterfall-tick.kind-tool { background: var(--tool); }
    .waterfall-tick.kind-workflow { background: var(--runtime); }
    .waterfall-tick.kind-ptc { background: var(--terminal); }
    .waterfall-tick.kind-job { background: var(--summary); }
    .waterfall-tick.kind-wait { background: var(--warn); }
    .waterfall-tick.kind-milestone { background: var(--muted); }
    .waterfall-tick.status-failed { background: var(--error); }
    /* An envelope's own bar is the frame; its ticks are the work inside. */
    .kind-run .waterfall-bar, .kind-turn .waterfall-bar { opacity: .3; }

    .waterfall-row { position: relative; }
    .waterfall-tip {
      display: none; position: absolute; z-index: 30;
      left: 12px; top: calc(100% + 2px);
      max-width: 540px; padding: 8px 10px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
      font-size: 11.5px; line-height: 1.5; white-space: pre-line;
      pointer-events: none;
    }
    .waterfall-row:hover .waterfall-tip { display: block; }
    /* ---- activity strip --------------------------------------------------
       Calls per slice of the same axis the rows are drawn on, so a spike sits
       above the steps that made it. A red mark sits over any slice holding a
       failure. */
    .activity-strip { margin: 0 0 6px; }
    .activity-head {
      display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
      font-size: 10.5px; color: var(--muted); margin-bottom: 4px;
    }
    .activity-title {
      letter-spacing: .08em; text-transform: uppercase; font-size: 10px;
    }
    .activity-key {
      display: inline-flex; align-items: center; gap: 5px; margin-left: auto;
    }
    .activity-key-label { margin-right: 6px; }
    .activity-row {
      display: grid;
      grid-template-columns: var(--wf-columns);
      gap: 10px; align-items: end;
    }
    .activity-columns {
      display: flex; align-items: flex-end; gap: 1px; height: 46px;
      border-bottom: 1px solid var(--border);
    }
    .activity-col {
      position: relative; flex: 1 1 0; height: 100%;
      display: flex; align-items: flex-end; min-width: 1px;
    }
    .activity-bar {
      width: 100%; display: flex; flex-direction: column-reverse;
      border-radius: 1px 1px 0 0; overflow: hidden; min-height: 0;
    }
    .activity-seg.llm { background: var(--assistant); }
    .activity-seg.tool { background: var(--tool); }
    .activity-error {
      position: absolute; top: -3px; left: 50%; width: 4px; height: 4px;
      margin-left: -2px; background: var(--error); transform: rotate(45deg);
    }
    .activity-error.sample {
      position: static; margin: 0; transform: rotate(45deg); flex: none;
    }

    /* The row's link into its own session log, at the event the span records. */
    .waterfall-duration { display: flex; align-items: baseline; gap: 5px; justify-content: flex-end; }
    .waterfall-open {
      color: var(--muted); text-decoration: none; font-size: 11px;
      opacity: .55; flex: none;
    }
    .waterfall-row:hover .waterfall-open { opacity: 1; color: var(--accent); }
    .waterfall-open:hover { text-decoration: none; }

  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/viz_app.js"></script>
  <script>
    // A pairing chip (`.tool-link`) lives inside a <summary>, so a bare click on
    // it would both navigate AND toggle the enclosing <details>. Cancel the
    // default (which suppresses the fold toggle and the native jump) when the
    // target anchor exists, then highlight + scroll ourselves. The highlight is
    // a `jump-target` class rather than `location.hash` — the hash carries the
    // viewer's s/v/seq position state, which a bare `#tool-result-N` assignment
    // would wipe (the scrollspy re-records seq= right after the jump scrolls).
    // Delegated on document, so it survives the app's virtual-DOM re-renders.
    // Rabbita captures ordinary links and prevents their browser default before
    // the event reaches document. This handler therefore identifies its own
    // `.tool-link` first instead of treating `defaultPrevented` as a veto.
    // Missing targets fall through to Rabbita's link handling.
    document.addEventListener("click", function (e) {
      // Leave modified / non-primary clicks to the browser (open-in-new-tab etc.).
      if (e.button !== 0) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (!(e.target instanceof Element)) return;
      var link = e.target.closest("a.tool-link");
      if (!link) return;
      var href = link.getAttribute("href") || "";
      if (href.charAt(0) !== "#") return;
      var el = document.getElementById(href.slice(1));
      if (!el) return;
      e.preventDefault();
      document.querySelectorAll(".jump-target").forEach(function (old) {
        old.classList.remove("jump-target");
      });
      el.classList.add("jump-target");
      el.scrollIntoView({ block: "center" });
    });
  </script>
</body>
</html>
